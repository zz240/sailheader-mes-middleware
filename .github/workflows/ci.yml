# 每次推送 master / PR 都跑：后端测试 + 前端类型检查与构建。
# 与本地同一条命令：pwsh -File tools/run-tests.ps1
# 为什么用 windows-latest：测试里有依赖相对路径的用例，本地与 CI 保持同一套路径语义。
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: spike/pom.xml

      - name: 跑测试
        run: pwsh -NoProfile -File tools/run-tests.ps1

  frontend:
    name: 前端类型检查与构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查 + 构建（vue-tsc --noEmit && vite build）
        working-directory: frontend
        run: npm run build
