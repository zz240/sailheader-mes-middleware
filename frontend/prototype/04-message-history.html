<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>消息历史 · 运行与消息步 — edge-gateway 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23252b30'/%3E%3Ctext x='8' y='11.5' font-size='8' font-family='monospace' fill='%233fae7a' text-anchor='middle'%3E%E2%86%BB%3C/text%3E%3C/svg%3E" />
<style>
  /* ─── 令牌：沿用字段映射工作台已锁定的控制台色板（中性两级 + 单一信号色） ─── */
  :root {
    --bg:      oklch(98% 0.005 250);
    --surface: oklch(100% 0 0);
    --fg:      oklch(22% 0.02 240);
    --muted:   oklch(50% 0.018 240);
    --border:  oklch(90% 0.008 240);
    --accent:  oklch(48% 0.15 150);

    --accent-soft:   color-mix(in oklch, var(--accent) 12%, transparent);
    --accent-line:   color-mix(in oklch, var(--accent) 52%, transparent);
    --accent-strong: color-mix(in oklch, var(--accent) 86%, black);
    --fg-soft:       color-mix(in oklch, var(--fg) 5%, transparent);
    --fg-tint:       color-mix(in oklch, var(--fg) 9%, transparent);
    --bg-sunken:     color-mix(in oklch, var(--bg) 62%, var(--surface));
    --warn:   oklch(58% 0.14 70);
    --danger: oklch(54% 0.18 27);
    --warn-soft:   color-mix(in oklch, var(--warn) 14%, transparent);
    --danger-soft: color-mix(in oklch, var(--danger) 11%, transparent);
    --warn-ink:   color-mix(in oklch, var(--warn) 66%, black);
    --danger-ink: color-mix(in oklch, var(--danger) 82%, black);
    --ok-ink:     color-mix(in oklch, var(--accent) 78%, black);

    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

    --fs-body: 13.5px;
    --fs-meta: 11.5px;
    --radius: 8px;
    --radius-lg: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input, select { font: inherit; color: inherit; }
  p { margin: 0; }
  code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h1 { font-family: var(--font-display); margin: 0; font-size: 18px; font-weight: 620; letter-spacing: -.015em; }
  ::selection { background: var(--accent-soft); }

  /* ─── 按钮 / 分段 ─────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; min-height: 30px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); color: var(--fg);
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn:hover { background: var(--fg-soft); border-color: color-mix(in oklch, var(--fg) 32%, var(--border)); }
  .btn:active { transform: translateY(.5px); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--surface); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--fg-soft); color: var(--fg); }
  .btn-sm { padding: 3px 8px; min-height: 24px; font-size: 11.5px; }
  .btn[aria-pressed="true"] { background: var(--fg-tint); border-color: color-mix(in oklch, var(--fg) 26%, var(--border)); color: var(--fg); font-weight: 600; }
  .spacer { flex: 1 1 auto; }
  .kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--bg); }

  .seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .seg button { padding: 4px 10px; min-height: 26px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover { background: var(--fg-soft); color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--fg-tint); color: var(--fg); font-weight: 600; }
  .seg-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .seg-label { font-size: 11px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; cursor: help; }

  /* ─── 应用条 / 页头 ───────────────────────────────────────────────── */
  .appbar { flex: 0 0 auto; display: flex; align-items: center; gap: 16px; padding: 9px 18px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { font-weight: 650; letter-spacing: -.01em; font-size: 14px; }
  .brand span { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11.5px; margin-left: 6px; }
  .crumbs { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .crumbs b { color: var(--fg); font-weight: 550; }
  .appbar .right { margin-left: auto; display: flex; align-items: center; gap: 9px; }

  .pagehead { flex: 0 0 auto; padding: 13px 18px 0; }
  .title-row { display: flex; align-items: flex-start; gap: 13px; flex-wrap: wrap; }
  .subline { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .subline code { color: var(--fg); font-size: 11.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .counts { margin-left: auto; display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .counts b { color: var(--fg); font-weight: 600; }

  /* ─── 筛选条 ─────────────────────────────────────────────────────── */
  .filters { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 11px 18px 12px; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .ctl > label { font-size: 11.5px; color: var(--muted); }
  select.ctl-in, input.ctl-in {
    border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
    padding: 5px 8px; min-height: 30px; font-size: 12px; color: var(--fg); max-width: 220px;
  }
  input.ctl-in { font-family: var(--font-mono); }
  select.ctl-in:focus, input.ctl-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .filter-note { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .filter-note b { color: var(--fg); font-weight: 600; }

  /* ─── 工作区骨架 ─────────────────────────────────────────────────── */
  .workspace { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; padding: 0 18px 14px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .phead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sunken); min-height: 44px; }
  .phead .pt { font-size: 12.5px; font-weight: 620; display: flex; align-items: center; gap: 7px; }
  .phead .ps { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .phead .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .scroll { flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; }

  .runs { flex: 0 0 322px; min-width: 0; }
  .detail { flex: 1 1 auto; min-width: 0; }

  /* ─── 运行 / 消息步 列表 ─────────────────────────────────────────── */
  .rlist { padding: 6px 6px 10px; }
  .ritem { position: relative; display: block; width: 100%; text-align: left; padding: 8px 10px 9px 12px; border-radius: 8px; border: 1px solid transparent; }
  .ritem:hover { background: var(--fg-soft); }
  .ritem[aria-pressed="true"] { background: var(--bg-sunken); border-color: var(--border); }
  .ritem[aria-pressed="true"]::before { content: ''; position: absolute; left: 2px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); }
  .r-top { display: flex; align-items: center; gap: 7px; }
  .r-id { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .r-job { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .r-top .st { margin-left: auto; }
  .r-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .r-err { font-size: 11px; color: var(--danger-ink); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-biz { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg); background: var(--fg-soft); border-radius: 4px; padding: 0 5px; }
  .r-sep { height: 1px; background: var(--border); margin: 6px 10px; }
  .list-empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 12px; }

  /* 状态芯片 */
  .st { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .02em; background: var(--surface); color: var(--muted); white-space: nowrap; }
  .st::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .st.ok { color: var(--ok-ink); border-color: color-mix(in oklch, var(--accent) 34%, var(--border)); background: var(--accent-soft); }
  .st.bad { color: var(--danger-ink); border-color: color-mix(in oklch, var(--danger) 32%, var(--border)); background: var(--danger-soft); }
  .st.warn { color: var(--warn-ink); border-color: color-mix(in oklch, var(--warn) 34%, var(--border)); background: var(--warn-soft); }
  .st.run::before { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  /* ─── 消息头 / 消息切换 ──────────────────────────────────────────── */
  .dbody { padding: 12px 14px 16px; }
  .dhead { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .dhead h2 { font-family: var(--font-display); margin: 0; font-size: 14.5px; font-weight: 620; letter-spacing: -.01em; }
  .dsub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 9px; flex-wrap: wrap; }
  .dsub b { color: var(--fg); font-weight: 600; }
  .runerr { margin-top: 9px; display: flex; gap: 8px; align-items: flex-start; border: 1px solid color-mix(in oklch, var(--danger) 26%, var(--border)); background: var(--danger-soft); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--danger-ink); }
  .runerr .mk { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid color-mix(in oklch, var(--danger) 34%, transparent); border-radius: 4px; padding: 0 4px; flex: 0 0 auto; }

  .msgs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .msgs .lbl { font-size: 11.5px; color: var(--muted); }
  .mchip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); text-align: left; }
  .mchip:hover { background: var(--fg-soft); }
  .mchip[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); }
  .mchip .mid { font-family: var(--font-mono); font-size: 11px; color: var(--fg); }
  .mchip .mbk { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .mchip .st { height: 18px; }

  /* ─── 步骤链 ─────────────────────────────────────────────────────── */
  .chain-wrap { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-sunken); }
  .chain-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .chain-head .ct { font-size: 12px; font-weight: 620; }
  .chain-head .cs { font-size: 11px; color: var(--muted); }
  .chain { display: flex; align-items: stretch; gap: 0; padding: 11px 12px; overflow-x: auto; }
  .cnode { flex: 0 0 auto; display: flex; align-items: center; }
  .cbtn { min-height: 58px; min-width: 124px; text-align: left; padding: 6px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
  .cbtn:hover { border-color: color-mix(in oklch, var(--fg) 30%, var(--border)); }
  .cbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .cbtn.bad { border-color: color-mix(in oklch, var(--danger) 40%, var(--border)); background: color-mix(in oklch, var(--danger) 5%, var(--surface)); }
  .cbtn .cn { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .cbtn .ca { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: -.01em; }
  .cbtn .cl { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 142px; }
  .cbtn .cm { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .cstat { font-family: var(--font-mono); font-size: 10px; }
  .cstat.ok { color: var(--ok-ink); }
  .cstat.bad { color: var(--danger-ink); }
  .cstat.warn { color: var(--warn-ink); }
  .cstat.run { color: var(--muted); }
  .carrow { width: 22px; text-align: center; color: var(--muted); font-family: var(--font-mono); font-size: 12px; flex: 0 0 auto; }
  .cbtn.node0 { min-width: 108px; background: transparent; border-style: dashed; }
  .cbtn.node0 .ca { font-weight: 500; color: var(--muted); }
  .snapdots { display: inline-flex; gap: 3px; align-items: center; }
  .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-tint); }
  .sdot.on { background: var(--accent); }
  .sdot.none { background: transparent; border: 1px dashed color-mix(in oklch, var(--muted) 60%, transparent); }

  /* ─── 步骤详情卡 ─────────────────────────────────────────────────── */
  .card { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
  .sc-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .sc-head .sn { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .sc-head .sa { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
  .sc-head .sl { font-size: 12.5px; }
  .sc-head .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .fact { display: inline-flex; align-items: baseline; gap: 5px; font-size: 11px; color: var(--muted); }
  .fact b { font-family: var(--font-mono); font-weight: 600; color: var(--fg); }
  .sc-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sunken); }
  .q { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 4px 8px; min-height: 28px; font-size: 11.5px; font-family: var(--font-mono); width: 178px; }
  .q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .snaps { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; padding: 12px; }
  .snap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
  .snap-head { padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--bg-sunken); }
  .snap-head .shr { display: flex; align-items: center; gap: 7px; }
  .snap-head .shot { font-size: 12.5px; font-weight: 620; }
  .snap-head .shw { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .snap-head .right { margin-left: auto; display: flex; align-items: center; gap: 5px; }
  .snap-head .snote { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .meter { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
  .meter-bar { flex: 0 0 92px; height: 5px; border-radius: 3px; background: var(--fg-tint); overflow: hidden; }
  .meter-bar i { display: block; height: 100%; background: var(--accent); }
  .meter-bar i.hot { background: var(--warn); }
  .meter-txt { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .snap-body { padding: 4px 0 8px; }

  /* ─── JSON 格式化树 ──────────────────────────────────────────────── */
  .jrow { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto minmax(0, auto) auto; align-items: baseline; gap: 6px; padding: 2px 8px 2px 8px; padding-left: calc(8px + var(--d) * 15px); min-height: 22px; }
  .jrow:hover { background: var(--fg-soft); }
  .jrow .jt { width: 14px; height: 14px; display: grid; place-items: center; color: var(--muted); font-size: 9px; border-radius: 3px; align-self: center; }
  .jrow .jt:hover { background: var(--fg-tint); color: var(--fg); }
  .jkey { font-family: var(--font-mono); font-size: 12px; color: var(--fg); overflow-wrap: anywhere; }
  .jkey mark { background: color-mix(in oklch, var(--warn) 30%, transparent); color: var(--fg); border-radius: 3px; }
  .jctx { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
  .jtb { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); letter-spacing: .03em; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--surface); white-space: nowrap; }
  .jv { font-family: var(--font-mono); font-size: 12px; color: var(--fg); overflow-wrap: anywhere; }
  .jv.s { color: var(--fg); }
  .jv.n { font-variant-numeric: tabular-nums; }
  .jsum { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .jdate { display: inline-flex; align-items: baseline; gap: 5px; }
  .jdate .tz { color: var(--muted); font-size: 10.5px; }
  .jnull { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); border: 1px dashed color-mix(in oklch, var(--muted) 55%, transparent); border-radius: 4px; padding: 0 5px; }
  .jbool { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: var(--surface); }
  .jacts { display: flex; gap: 4px; opacity: 0; transition: opacity .12s ease; }
  .jrow:hover .jacts, .jrow:focus-within .jacts { opacity: 1; }
  .jacts button { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: var(--surface); }
  .jacts button:hover { color: var(--fg); border-color: color-mix(in oklch, var(--fg) 30%, var(--border)); }
  .tree-empty { padding: 14px 12px; color: var(--muted); font-size: 12px; }
  .note { display: flex; gap: 7px; align-items: flex-start; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); background: var(--bg-sunken); }
  .note.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .note code { color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 11px; }
  .tchip { font-family: var(--font-mono); font-size: 10px; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; flex: 0 0 auto; }
  pre.raw { margin: 0; padding: 10px 12px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
  pre.rawtext { color: var(--fg); }

  /* ─── 对照（上一步 → 本步） ─────────────────────────────────────── */
  .diff { padding: 0 12px 12px; }
  .dsum { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 0 8px; font-size: 11.5px; color: var(--muted); }
  .dc { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; }
  .dc i { width: 7px; height: 7px; border-radius: 2px; display: block; }
  .dc.same i { background: var(--fg-tint); }
  .dc.chg i { background: var(--warn); }
  .dc.add i { background: var(--accent); }
  .dc.del i { background: color-mix(in oklch, var(--danger) 60%, transparent); }
  .dgrid { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

<header class="appbar" data-od-id="app-bar">

  <div class="right">

  </div>

<section class="pagehead" data-od-id="page-head">

      <p class="subline">

        <span>·</span>
        <span>失败即停、重试退避、从失败步断点续跑<code>ADR-0003</code></span>
        <span>·</span>
        <span>快照以 <code>message_step</code> 的 TEXT 列存储，上限 64 KB<code>#127</code></span>
      </p>
    </div>
    <div class="counts" aria-label="当前数据集计数">
      <span>运行 <b id="cRuns">0</b></span>
      <span>消息 <b id="cMsgs">0</b></span>
      <span>消息步 <b id="cSteps">0</b></span>
      <span>失败步 <b id="cFail">0</b></span>
    </div>
  </div>
</section>

<section class="filters" data-od-id="history-filters">
  <div class="ctl">
    <label for="fJob">任务</label>
    <select class="ctl-in" id="fJob" data-act="filter">
      <option value="all">全部任务</option>
      <option value="7">#7 MDM 编码回写（B6 链）</option>
      <option value="3">#3 站点连通性探测</option>
      <option value="12">#12 日终对账（条数 / 金额）</option>
    </select>
  </div>
  <div class="ctl">
    <label for="fStatus">状态</label>
    <select class="ctl-in" id="fStatus" data-act="filter">
      <option value="all">全部状态</option>
      <option value="FAILED">FAILED</option>
      <option value="SUCCESS">SUCCESS</option>
      <option value="REDELIVERED">REDELIVERED</option>
      <option value="RUNNING">RUNNING</option>
    </select>
  </div>
  <div class="ctl">
    <label for="fBiz">业务键</label>
    <input class="ctl-in" id="fBiz" data-act="filter" placeholder="SO-2026-0917-0042" aria-label="按业务键检索（消息步）" />
  </div>
  <button class="btn" data-act="query">查询</button>
  <button class="btn btn-ghost" data-act="reset">重置</button>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="历史视图" data-od-id="view-toggle">
    <button data-act="view" data-view="runs" aria-pressed="true">按运行展开</button>
    <button data-act="view" data-view="steps" aria-pressed="false">消息步检索</button>
  </div>
  <span class="filter-note" id="filterNote"></span>
</section>

<main class="workspace" data-od-id="history-workspace">
  <aside class="panel runs" data-od-id="run-list">
    <div class="phead">
      <span class="pt" id="listTitle">运行</span>
      <span class="ps" id="listCount"></span>
      <span class="right"><span class="filter-note" id="listHint">选一条运行看它的消息与消息步</span></span>
    </div>
    <div class="scroll"><div class="rlist" id="list"></div></div>
  </aside>

  <section class="panel detail" data-od-id="message-detail">
    <div class="phead">
      <span class="pt">消息详情</span>
      <span class="ps" id="detailPath">—</span>
      <span class="right">
        <button class="btn btn-sm" data-act="copy-msg" data-od-id="btn-copy-message">复制消息 ID</button>
      </span>
    </div>
    <div class="scroll"><div class="dbody" id="detail"></div></div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>

</div>

        ? '<button class="btn btn-primary" data-act="redeliver" data-od-id="btn-redeliver">从步骤 ' + s.n + ' 断点重投</button>'
          + '<span class="hint">重投成功后原步置 <code>REDELIVERED</code>，重投失败则原步保持 <code>FAILED</code>（#108）。</span>'
        : '<span class="hint">本步状态 <code>' + esc(s.status) + '</code>，不可重投：只有 <code>FAILED</code> 消息步能断点续跑（#108）。'
          + (s.status === 'REDELIVERED' ? '这一步的首跑报错已由重投修复。' : '') + '</span>')
      + '</div></div>';
  }

  function errHTML(s) {
    if (!s.error) return '';
    var lines = s.error.split('\n');
    return '<div class="errbox" data-od-id="step-error"><div class="eh"><span>错误</span>'
      + '<span class="mono" style="font-weight:500;opacity:.85">' + esc(s.action) + '</span>'
      + '<span class="spacer"></span><span class="mono" style="font-weight:500;opacity:.85">' + esc(s.at) + '</span></div>'
      + '<pre><b>' + esc(lines[0]) + '</b>' + (lines.length > 1 ? '\n' + esc(lines.slice(1).join('\n')) : '') + '</pre></div>';
  }

  /* ── 单份快照面板 ───────────────────────────────────────────────── */
  function snapHTML(c, which) {
    var s = c.step;
    var isInput = which === 'input';
    var title = isInput ? '输入快照' : '数据快照';
    var raw = isInput ? s.input : s.data;
    var text = isInput ? s.inputText : s.dataText;
    var missing = isInput ? s.inputMissing : s.dataMissing;
    var note = isInput ? s.inputNote : s.dataNote;
    var where = isInput ? '进入本步的报文' : '本步输出 → context[' + s.n + ']';

    var head = '<div class="snap-head"><div class="shr"><span class="shot">' + title + '</span>'
      + '<span class="shw">' + where + '</span>'
      + '<span class="right">'
      + (text || missing ? '' : '<button class="btn btn-sm" data-act="copy-json" data-which="' + which + '">复制 JSON</button>')
      + '</span></div>'
      + (note ? '<div class="snote">' + esc(note) + '</div>' : '')
      + metaHTML(raw, text)
      + '</div>';

    var body;
    if (text) body = rawTextHTML(text, which);
    else if (missing) body = '<div class="tree-empty">本步没有' + title + '。<br />' + esc(missing) + '</div>';
    else body = treeBlock(raw, which, c);
    return '<div class="snap" data-od-id="snapshot-' + which + '">' + head + '<div class="snap-body">' + body + '</div></div>';
  }

  function metaHTML(raw, text) {
    var payload = text ? text : (raw === undefined ? '' : JSON.stringify(raw));
    if (!payload) return '';
    var b = bytesOf(payload), pct = Math.min(100, (b / CAP) * 100);
    var keys = text ? 0 : (isCont(raw) ? Object.keys(raw).length : 1);
    return '<div class="meter"><span class="meter-bar"><i class="' + (pct > 50 ? 'hot' : '') + '" style="width:' + Math.max(2, pct) + '%"></i></span>'
      + '<span class="meter-txt">' + (text ? '文本' : keys + (isArr(raw) ? ' 项' : ' 键')) + ' · ' + fmtBytes(b) + ' / 上限 64 KB</span></div>';
  }

  function rawTextHTML(text, which) {
    return '<div class="rawtext"><pre class="raw">' + esc(text) + '</pre></div>'
      + '<div class="note warn" data-od-id="text-note"><span class="tchip">非 JSON 文本</span>'
      + '<span>断点续投回填只认 JSON 值（对象 / 数组 / 标量）：这段文本' + (which === 'data' ? '不会进上下文' : '无法解析') + '，'
      + '下游引用该步时会取到空值（#90 / #123 口径）。</span></div>';
  }

  /* ── 格式化树 ───────────────────────────────────────────────────── */
  function treeBlock(raw, which, c) {
    if (raw === undefined) return '<div class="tree-empty">本步没有这份快照。</div>';
    if (!isCont(raw)) {
      return '<div class="tree" role="tree" aria-label="快照">' + leafRow('（标量）', '', raw, 0, which) + '</div>';
    }
    var q = state.query.toLowerCase();
    var count = 0;
    var html = walk(raw, '', 0, q, function () { count++; });
    var footer = '';
    if (q) {
      footer = '<div class="note"><span class="tchip">搜索</span><span>“' + esc(state.query) + '” 命中 <b>' + count + '</b> 处键路径'
        + (count ? '，命中分支已自动展开' : '：没有匹配，试着换成字段名片段') + '</span></div>';
    }
    if (state.raw) {
      return '<pre class="raw">' + esc(JSON.stringify(raw, null, 2)) + '</pre>' + footer;
    }
    var emptyWarn = '';
    if (which === 'data' && c.step.emptyWarn && Object.keys(raw).length === 0) {
      emptyWarn = '<div class="note warn" data-od-id="empty-note"><span class="tchip">空对象</span><span>' + esc(c.step.emptyWarn) + '</span></div>';
    }
    return '<div class="tree" role="tree" aria-label="快照格式化视图" id="tree-' + which + '">' + html + '</div>' + emptyWarn + footer;
  }

  function walk(val, path, d, q, onMatch) {
    var out = '';
    var keys = isArr(val) ? val.map(function (_, i) { return String(i); }) : Object.keys(val);
    keys.forEach(function (k) {
      var v = isArr(val) ? val[Number(k)] : val[k];
      var p = path ? (isArr(val) ? path + '[' + k + ']' : path + '.' + k) : k;
      var cont = isCont(v);
      var selfMatch = !q || p.toLowerCase().indexOf(q) >= 0;
      var childHit = cont ? subtreeMatch(v, p, q) : false;
      if (q && !selfMatch && !childHit) return;
      if (selfMatch && onMatch) onMatch();
      if (cont && q && (childHit || selfMatch)) expanded[p] = true;
      var open = cont && (expanded[p] === true || (expanded[p] === undefined && d < state.depth));
      out += rowHTML(k, p, v, d, cont, open, q);
      if (cont && open && !state.raw) out += walk(v, p, d + 1, q, onMatch);
    });
    return out;
  }

  function subtreeMatch(v, path, q) {
    if (!q) return false;
    if (path.toLowerCase().indexOf(q) >= 0) return true;
    if (!isCont(v)) return false;
    var keys = isArr(v) ? v.map(function (_, i) { return String(i); }) : Object.keys(v);
    for (var i = 0; i < keys.length; i++) {
      var child = isArr(v) ? v[Number(keys[i])] : v[keys[i]];
      var p = isArr(v) ? path + '[' + keys[i] + ']' : path + '.' + keys[i];
      if (subtreeMatch(child, p, q)) return true;
    }
    return false;
  }

  function rowHTML(k, p, v, d, cont, open, q) {
    var keyHTML = highlight(k, q);
    var ctx = d === 0 ? keyLabel(k) : '';
    var typeBadge;
    if (isArr(v)) typeBadge = 'ARR';
    else if (isObj(v)) typeBadge = 'OBJ';
    else if (v === null) typeBadge = 'NULL';
    else if (typeof v === 'string') typeBadge = v === '' ? 'EMPTY' : 'STR';
    else if (typeof v === 'number') typeBadge = 'NUM';
    else if (typeof v === 'boolean') typeBadge = 'BOOL';
    else typeBadge = typeof v;

    var valueHTML;
    if (cont) {
      valueHTML = '<span class="jsum">' + (isArr(v) ? '[' + v.length + ' 项]' : '{' + Object.keys(v).length + ' 键}') + '</span>';
      if (isObj(v) && Object.keys(v).length === 0) valueHTML = '<span class="jnull">空对象 {}</span>';
      if (isArr(v) && v.length === 0) valueHTML = '<span class="jnull">空数组 []</span>';
    } else {
      valueHTML = scalarHTML(v, p);
    }

    var acts = '<span class="jacts"><button data-act="copy-path" data-path="' + esc(p) + '" title="复制上下文路径">路径</button>'
      + '<button data-act="copy-val" data-path="' + esc(p) + '" title="复制值">值</button></span>';

    return '<div class="jrow" role="treeitem" aria-level="' + (d + 1) + '"'
      + (cont ? ' aria-expanded="' + (open ? 'true' : 'false') + '"' : '')
      + ' style="--d:' + d + '" data-path="' + esc(p) + '" title="' + esc(toCtxPath(p)) + '">'
      + (cont ? '<button class="jt" data-act="toggle-node" data-path="' + esc(p) + '" aria-label="展开或收起">' + (open ? '▾' : '▸') + '</button>' : '<span class="jt"></span>')
      + '<span class="jkey">' + keyHTML + (ctx ? ' <span class="jctx">' + ctx + '</span>' : '') + '</span>'
      + '<span class="jtb">' + typeBadge + '</span>'
      + '<span class="jv">' + valueHTML + '</span>'
      + acts
      + '</div>';
  }

  /* 命中高亮：先切片再转义，避免把实体本身标成命中 */
  function highlight(raw, q) {
    if (!q) return esc(raw);
    var i = raw.toLowerCase().indexOf(q);
    if (i < 0) return esc(raw);
    return esc(raw.slice(0, i)) + '<mark>' + esc(raw.slice(i, i + q.length)) + '</mark>' + highlight(raw.slice(i + q.length), q);
  }

  function scalarHTML(v, p) {
    if (v === null) return '<span class="jnull">null</span>';
    if (v === '') return '<span class="jnull">"" 空字符串</span>';
    if (typeof v === 'boolean') return '<span class="jbool">' + v + '</span>';
    if (typeof v === 'number') return '<span class="jv n">' + String(v) + '</span>';
    var str = String(v);
    var iso = fmtIso(str);
    if (iso) return '<span class="jdate" title="' + esc(str) + '"><span>' + esc(iso.t) + '</span><span class="tz">' + esc(iso.tz) + '</span></span>';
    if (str.length > 72 && !longOpen[p]) {
      return '<span class="jv s">' + esc(str.slice(0, 72)) + '…</span> '
        + '<button class="jtb" data-act="open-long" data-path="' + esc(p) + '">展开 ' + str.length + ' 字</button>';
    }
    return '<span class="jv s">' + esc(str) + '</span>';
  }

  function leafRow(label, p, v, d) {
    return '<div class="jrow" role="treeitem" aria-level="1" style="--d:0">'
      + '<span class="jt"></span><span class="jkey">' + esc(label) + '</span>'
      + '<span class="jtb">SCALAR</span><span class="jv">' + scalarHTML(v, p) + '</span><span class="jacts"></span></div>';
  }

  /* ── 与上一步对照 ───────────────────────────────────────────────── */
  function flatten(v, path, out) {
    if (isCont(v)) {
      var keys = isArr(v) ? v.map(function (_, i) { return String(i); }) : Object.keys(v);
      if (!keys.length) { out[path || '（空）'] = isArr(v) ? '[]' : '{}'; return out; }
      keys.forEach(function (k) {
        var child = isArr(v) ? v[Number(k)] : v[k];
        var p = path ? (isArr(v) ? path + '[' + k + ']' : path + '.' + k) : k;
        flatten(child, p, out);
      });
      return out;
    }
    out[path || '（标量）'] = v;
    return out;
  }
  function showVal(v) {
    if (v === null) return 'null';
    if (v === '') return '""';
    if (typeof v === 'string') {
      var iso = fmtIso(v);
      return iso ? iso.t + ' ' + iso.tz : (v.length > 46 ? v.slice(0, 46) + '…' : v);
    }
    return String(v);
  }
  function diffHTML(c) {
    var prev = c.prev;
    var head = '<div class="dsum">';
    if (!prev) {
      return '<div class="diff"><div class="tree-empty">步骤 ' + c.step.n + ' 是这条消息的第一步，没有上一步可对照。</div></div>';
    }
    if (prev.data === undefined || c.step.data === undefined) {
      var who = prev.data === undefined ? '上一步（步骤 ' + prev.n + ' ' + esc(prev.action) + '）' : '本步（步骤 ' + c.step.n + ' ' + esc(c.step.action) + '）';
      return '<div class="diff" data-od-id="snapshot-diff"><div class="tree-empty">' + who
        + '没有数据快照，没法对照。<br />失败步、被跳步与运行中的步骤都不写快照；MQ 入口动作也不记成功步快照（#90）。</div></div>';
    }
    var a = flatten(prev.data, '', {});
    var b = flatten(c.step.data, '', {});
    var keys = Object.keys(a).concat(Object.keys(b).filter(function (k) { return !(k in a); }));
    var stat = { same: 0, chg: 0, add: 0, del: 0 };
    var rows = '';
    keys.forEach(function (k) {
      var inA = k in a, inB = k in b, st;
      if (inA && inB) st = JSON.stringify(a[k]) === JSON.stringify(b[k]) ? 'same' : 'chg';
      else if (inB) st = 'add';
      else st = 'del';
      stat[st]++;
      rows += '<div class="drow st-' + st + '"><span class="dpath" title="' + esc(toCtxPath(k)) + '">' + esc(k) + '</span>'
        + '<span class="dval old">' + (inA ? esc(showVal(a[k])) : '—') + '</span>'
        + '<span class="darrow">→</span>'
        + '<span class="dval new">' + (inB ? esc(showVal(b[k])) : '—') + '</span>'
        + '<span class="dchip">' + ({ same: '同', chg: '改', add: '增', del: '减' })[st] + '</span></div>';
    });
    head += '<span>上一步 <b class="mono">步骤 ' + prev.n + ' ' + esc(prev.action) + '</b> 的输出 → 本步 <b class="mono">步骤 ' + c.step.n + ' ' + esc(c.step.action) + '</b> 的输出</span>'
      + '<span class="spacer"></span>'
      + '<span class="dc same"><i></i>同 ' + stat.same + '</span>'
      + '<span class="dc chg"><i></i>改 ' + stat.chg + '</span>'
      + '<span class="dc add"><i></i>增 ' + stat.add + '</span>'
      + '<span class="dc del"><i></i>减 ' + stat.del + '</span></div>';
    return '<div class="diff" data-od-id="snapshot-diff">' + head
      + '<div class="dgrid"><div class="dhead2"><span>路径</span><span>上一步</span><span></span><span>本步</span><span>状态</span></div>'
      + (rows || '<div class="tree-empty">两侧都没有可对照的字段。</div>') + '</div>'
      + '<div class="note"><span class="tchip">对照口径</span><span>按叶子路径对齐两侧快照：<code>改</code> 是同名路径取值变了，<code>增 / 减</code> 只出现在一侧。'
      + '映射步骤里，这一步就是「来源字段 → 目标字段」的实际证据。</span></div></div>';
  }

  /* ── 交互 ───────────────────────────────────────────────────────── */
  function toast(msg, kind) {
    var box = $('#toast');
    var d = document.createElement('div');
    if (kind === 'err') d.className = 'err';
    d.textContent = msg;
    box.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3000);
  }
  function setLive(t) { $('#live').textContent = t; }

  function copy(text, what) {
    var done = function () { toast('已复制：' + what); setLive('已复制 ' + what); };
    var fail = function () { toast('复制失败，请手动选中', 'err'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); done();
      } catch (e) { fail(); }
    }
  }

  function valAtPath(root, path) {
    if (!path) return root;
    var parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
    var v = root;
    for (var i = 0; i < parts.length; i++) {
      if (v === null || v === undefined) return undefined;
      v = v[parts[i]];
    }
    return v;
  }

  function openRedeliver() {
    var c = cur(), s = c.step;
    var ups = c.msg.steps.filter(function (x) { return x.n < s.n; });
    var list = ups.map(function (x) {
      var has = x.data !== undefined;
      var txt = x.dataText ? true : false;
      var note = txt ? '非 JSON 文本 · 不回填' : (has ? '有快照 · 回填 context[' + x.n + ']' : '无快照 · 不进上下文');
      return '<div class="rli"><span class="n">步骤 ' + x.n + '</span><span class="a">' + esc(x.action) + ' · ' + esc(x.status) + '</span>'
        + '<span class="f' + (has && !txt ? '' : ' no') + '">' + esc(note) + '</span></div>';
    }).join('') || '<div class="rli"><span class="n">—</span><span class="a">失败步之前没有可回填的步骤</span><span class="f no">空上下文</span></div>';

    $('#modalBody').innerHTML =
      '<p>从失败消息步 <b>#' + c.run.id + ' / 步骤 ' + s.n + ' ' + esc(s.action) + '</b>（业务键 <b>' + esc(c.msg.businessKey || '无') + '</b>）断点续跑。'
      + '重投按 <code>(runId, messageId)</code> 取 <code>step &lt; ' + s.n + '</code> 且 SUCCESS 的消息步，把各自 <code>data_snapshot</code> 解析后经属性 <code>edge.resumeContext</code> 投递，'
      + '断点路由入口回填 <code>context[step]</code>；<code>context[0]</code> 语义不变（= 该步 <code>inputSnapshot</code>）。</p>'
      + '<div class="rlist2">' + list + '</div>'
      + '<p>将回填的上游步骤，以及它们这次能提供什么：无快照（失败步 / 被跳步 / 非 JSON 文本）的步骤不进上下文，下游引用仍是空值。</p>';
    $('#overlay').hidden = false;
    var btn = document.querySelector('[data-act="confirm-redeliver"]');
    if (btn) btn.focus();
  }
  function closeModal() { $('#overlay').hidden = true; }

  function confirmRedeliver() {
    var c = cur(), s = c.step;
    if (s.status !== 'FAILED') { closeModal(); return; }
    var run = c.run;

    /* 新运行：这一步这次是正常跑通的 */
    var clone = JSON.parse(JSON.stringify(run));
    clone.id = run.id + 2;
    clone.startedAt = '2026-09-17 09:31:00';
    clone.cost = '2.4 s';
    clone.status = 'SUCCESS';
    clone.error = '';
    clone.redeliveredFrom = run.id;
    clone.messages.forEach(function (m) {
      m.redeliveredFrom = run.id;
      m.steps.forEach(function (x) {
        if (x.n === s.n) {
          x.status = 'SUCCESS';
          x.attempt = 1;
          x.cost = '46 ms';
          x.at = '09:31:02.140';
          x.error = '';
          x.dataMissing = '';
          x.data = { affected_rows: 1, code_id: 88231 };
          x.dataNote = '本步输出 → 写入 context[' + x.n + ']（重投这次跑通了）';
        }
      });
    });
    /* 原步：成功后置 REDELIVERED，原运行本身仍然是那次失败（#108） */
    s.status = 'REDELIVERED';
    s.attempt = (s.attempt || 1) + 1;

    RUNS.unshift(clone);
    state.runId = clone.id;
    closeModal();
    render();
    toast('重投完成：原运行 #' + run.id + ' 的步骤 ' + s.n + ' 置 REDELIVERED，新运行 #' + clone.id + ' SUCCESS');
    setLive('重投完成，新运行 ' + clone.id);
  }

  /* ── 事件委派 ───────────────────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    var ov = $('#overlay');
    if (!t) {
      if (!ov.hidden && e.target === ov) closeModal();
      return;
    }
    var act = t.dataset.act;
    var c;

    if (act === 'open-run') {
      state.runId = Number(t.dataset.run); state.msgIdx = 0;
      var r = runOf(state.runId);
      state.stepN = msgsOf(r)[0].steps[0].n;
      expanded = {}; longOpen = {};
      render();
    } else if (act === 'open-msg') {
      state.msgIdx = Number(t.dataset.msg);
      c = cur(); state.stepN = c.msg.steps[0].n;
      expanded = {}; longOpen = {};
      render();
    } else if (act === 'open-step') {
      state.runId = Number(t.dataset.run);
      state.msgIdx = Number(t.dataset.msg || 0);
      state.stepN = Number(t.dataset.step);
      expanded = {}; longOpen = {};
      render();
    } else if (act === 'view') {
      state.view = t.dataset.view;
      render();
    } else if (act === 'toggle-node') {
      var p = t.dataset.path;
      var row = t.closest('.jrow');
      var open = row.getAttribute('aria-expanded') === 'true';
      if (open) expanded[p] = false; else expanded[p] = true;
      renderDetail();
      var back = document.querySelector('.jrow[data-path="' + cssEsc(p) + '"] .jt');
      if (back) back.focus();
    } else if (act === 'open-long') {
      longOpen[t.dataset.path] = true; renderDetail();
    } else if (act === 'copy-path') {
      copy(toCtxPath(t.dataset.path), toCtxPath(t.dataset.path));
    } else if (act === 'copy-val') {
      c = cur();
      var which = t.closest('[data-od-id^="snapshot-"]');
      var root = which && which.dataset.odId === 'snapshot-data' ? c.step.data : c.step.input;
      var v = valAtPath(root, t.dataset.path);
      copy(typeof v === 'string' ? v : JSON.stringify(v), String(t.dataset.path).split('.').pop());
    } else if (act === 'copy-json') {
      c = cur();
      var w = t.dataset.which;
      var payload = w === 'input' ? c.step.input : c.step.data;
      if (payload === undefined) { toast('这一步没有可复制的 JSON 快照', 'err'); return; }
      copy(JSON.stringify(payload, null, 2), (w === 'input' ? '输入快照' : '数据快照') + ' JSON');
    } else if (act === 'raw') {
      state.raw = !state.raw; render();
    } else if (act === 'snapview') {
      state.snapView = t.dataset.sv; render();
    } else if (act === 'depth') {
      state.depth = Number(t.dataset.d); expanded = {}; render();
    } else if (act === 'copy-msg') {
      c = cur(); if (c.msg) copy(c.msg.id, '消息 ID');
    } else if (act === 'query') {
      render();
      toast('查询完成：' + (state.view === 'runs'
        ? RUNS.filter(runMatches).length + ' 条运行'
        : stepRows().length + ' 条消息步（状态 ' + (state.status === 'all' ? 'FAILED' : state.status) + '）'));
    } else if (act === 'reset') {
      state.jobId = 'all'; state.status = 'all'; state.biz = ''; state.view = 'runs'; state.query = '';
      $('#fJob').value = 'all'; $('#fStatus').value = 'all'; $('#fBiz').value = '';
      render();
    } else if (act === 'reload') {
      render();
      toast('已刷新（演示数据未变）');
    } else if (act === 'redeliver') {
      openRedeliver();
    } else if (act === 'close-modal') {
      closeModal();
    } else if (act === 'confirm-redeliver') {
      confirmRedeliver();
    }
  });

  function cssEsc(s) { return String(s).replace(/"/g, '\\"'); }

  document.addEventListener('input', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    if (t.id === 'fBiz') { state.biz = t.value.trim(); renderList(); }
    else if (t.dataset.act === 'search') {
      state.query = t.value.trim();
      renderDetail();
      var q = document.querySelector('.q');
      if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target.closest('[data-act="filter"]');
    if (!t) return;
    if (t.id === 'fJob') state.jobId = t.value;
    if (t.id === 'fStatus') state.status = t.value;
    render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#overlay').hidden) { closeModal(); }
  });

  /* ── 渲染入口 ───────────────────────────────────────────────────── */
  function renderHead() {
    var msgs = 0, steps = 0, fail = 0;
    RUNS.forEach(function (r) {
      msgs += msgsOf(r).length;
      steps += stepCount(r);
      fail += failSteps(r);
    });
    $('#cRuns').textContent = RUNS.length;
    $('#cMsgs').textContent = msgs;
    $('#cSteps').textContent = steps;
    $('#cFail').textContent = fail;
    $('#fJob').value = state.jobId;
    $('#fStatus').value = state.status;
    $('#fBiz').value = state.biz;
    document.querySelectorAll('[data-act="view"]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
    });
    $('#filterNote').innerHTML = state.view === 'steps'
      ? '消息步检索默认只看 <b>FAILED</b>（#74）· 业务键按消息步过滤'
      : '运行视图默认不过滤状态 · 业务键过滤到消息粒度';
  }
  function render() {
    var r = runOf(state.runId);
    if (!msgsOf(r).length) state.runId = RUNS[0].id;
    renderHead();
    renderList();
    renderDetail();
    save();
  }

  restore();
  render();
})();
</script>
</body>
</html>
