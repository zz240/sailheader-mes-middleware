<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>字段映射工作台 · edge-gateway 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23252b30'/%3E%3Cpath d='M4 5.5h3.2M4 10.5h3.2M11.5 5.5v5' stroke='%23e9edef' stroke-width='1.4' stroke-linecap='round'/%3E%3Cpath d='M7.2 5.5c2 0 1.6 5 4.3 5' stroke='%233fae7a' stroke-width='1.4' fill='none'/%3E%3C/svg%3E" />
<style>
  /* ─── 令牌：沿用上一轮已锁定的技术工具向色板（单一信号色，深浅两级中性） ─── */
  :root {
    --bg:      oklch(98% 0.005 250);
    --surface: oklch(100% 0 0);
    --fg:      oklch(22% 0.02 240);
    --muted:   oklch(50% 0.018 240);
    --border:  oklch(90% 0.008 240);
    --accent:  oklch(48% 0.15 150);

    --accent-soft:   color-mix(in oklch, var(--accent) 12%, transparent);
    --accent-line:   color-mix(in oklch, var(--accent) 52%, transparent);
    --accent-strong: color-mix(in oklch, var(--accent) 86%, black);
    --fg-soft:       color-mix(in oklch, var(--fg) 5%, transparent);
    --fg-tint:       color-mix(in oklch, var(--fg) 9%, transparent);
    --bg-sunken:     color-mix(in oklch, var(--bg) 62%, var(--surface));
    --ok:     oklch(52% 0.14 152);
    --warn:   oklch(58% 0.14 70);
    --danger: oklch(54% 0.18 27);

    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

    --fs-body: 13.5px;
    --fs-meta: 11.5px;
    --row-h: 46px;
    --radius: 8px;
    --radius-lg: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  p { margin: 0; }
  code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ─── 按钮 ─────────────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); color: var(--fg);
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn:hover { background: var(--fg-soft); border-color: color-mix(in oklch, var(--fg) 30%, var(--border)); }
  .btn:active { transform: translateY(0.5px); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 550; }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--surface); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--fg-soft); color: var(--fg); }
  .btn-sm { padding: 4px 9px; font-size: 11.5px; }
  .btn-danger { color: var(--danger); border-color: color-mix(in oklch, var(--danger) 34%, var(--border)); }
  .btn-danger:hover { background: color-mix(in oklch, var(--danger) 10%, transparent); border-color: var(--danger); color: var(--danger); }
  .btn-adapt { padding: 2px 7px; font-size: 11px; border-color: var(--accent-line); color: var(--accent); background: var(--surface); }
  .btn-adapt:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .ico { width: 14px; height: 14px; flex: 0 0 auto; }
  .spacer { flex: 1 1 auto; }

  /* ─── 应用条 / 页头 ───────────────────────────────────────────────── */
  .appbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 650; letter-spacing: -0.01em; font-size: 14px; }
  .brand span { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .crumbs b { color: var(--fg); font-weight: 550; }
  .crumbs .sep { color: color-mix(in oklch, var(--muted) 55%, transparent); }
  .appbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }

  .pagehead { flex: 0 0 auto; padding: 16px 20px 0; }
  .title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 620; letter-spacing: -0.015em; margin: 0; }
  .subline { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .subline code { color: var(--fg); font-size: 11.5px; }
  .prog { display: flex; align-items: center; gap: 8px; }
  .prog-bar { width: 92px; height: 6px; border-radius: 3px; background: var(--fg-tint); overflow: hidden; }
  .prog-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s ease; }
  .prog-txt { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .prog-txt b { color: var(--fg); font-weight: 600; }
  .title-row .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  /* ─── 工作区 / 画布骨架 ───────────────────────────────────────────── */
  .workspace {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    gap: 10px; padding: 14px 20px 16px;
  }
  .stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
  .canvas {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
  }
  .toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 12px; border-bottom: 1px solid var(--border);
  }
  .seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { padding: 5px 11px; font-size: 12px; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--fg-tint); color: var(--fg); font-weight: 600; }
  .seg button:hover { background: var(--fg-soft); color: var(--fg); }
  .tip { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tip code { color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 11px; }

  /* 作用域面包屑 */
  .scopebar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--accent-soft);
  }
  .scopebar .sb-lbl { font-size: 11px; color: var(--muted); }
  .crumb { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; background: var(--surface); color: var(--muted); }
  .crumb:hover { border-color: var(--accent); color: var(--fg); }
  .crumb.is-here { border-color: var(--accent-line); color: var(--fg); font-weight: 600; }
  .crumb .csep { color: color-mix(in oklch, var(--muted) 55%, transparent); }
  .scopebar .sb-note { font-size: 11px; color: var(--muted); }
  .scopebar .sb-note code { font-size: 10.5px; color: var(--fg); }

  .frame { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
  .pane { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
  .pane-source { flex: 0 0 var(--src-w, 280px); border-right: 1px solid var(--border); }
  .pane-target { flex: 1 1 auto; border-left: 1px solid var(--border); }
  .pane-head {
    flex: 0 0 auto; min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-sunken);
  }
  .pane-head .pt { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .pane-head .pt code { font-size: 11px; font-weight: 500; color: var(--muted); }
  .pane-head .ph { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pane-head .right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .pane-scroll { flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; }
  .grip { width: 5px; flex: 0 0 auto; cursor: col-resize; background: transparent; transition: background .12s ease; }
  .grip:hover, .grip.on { background: var(--accent-line); }

  /* 连接通道：默认为极淡的分隔，只在悬停或选中时实体化 */
  .wirezone {
    position: relative; flex: 0 0 108px; min-width: 64px;
    background: color-mix(in oklch, var(--bg) 55%, var(--surface));
  }
  .wires { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .wire { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; opacity: .26; }
  .wire.solid { stroke: var(--accent-line); stroke-width: 1.7; stroke-dasharray: none; opacity: 1; }
  .wire.live { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
  .wire.dim { opacity: .1; }
  .fdot { fill: var(--surface); stroke: var(--muted); stroke-width: 1.4; opacity: .35; }
  .fdot.on { fill: var(--accent); stroke: var(--accent); opacity: 1; }
  .rhit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
  .rhit:hover { stroke: color-mix(in oklch, var(--accent) 16%, transparent); }
  .band { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }
  .band.bad { stroke: var(--danger); }
  .flow { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }

  .wire-hint {
    position: absolute; left: 8px; right: 8px; top: 50%; transform: translateY(-50%);
    text-align: center; color: var(--muted); font-size: 11px; line-height: 1.6; pointer-events: none;
  }
  .wire-hint b { color: var(--fg); font-weight: 600; display: block; margin-bottom: 3px; }
  .armed {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; max-width: calc(100% - 16px);
    background: var(--fg); color: var(--bg); border-radius: 999px; padding: 6px 8px 6px 12px;
    font-size: 11.5px; box-shadow: 0 6px 20px color-mix(in oklch, var(--fg) 22%, transparent); z-index: 6;
  }
  .armed code { font-size: 11px; color: var(--bg); opacity: .85; }
  .armed button { color: var(--bg); opacity: .7; padding: 0 4px; font-size: 12px; }
  .armed button:hover { opacity: 1; }

  /* ─── 来源树 ─────────────────────────────────────────────────────── */
  .tree { padding-bottom: 8px; }
  .srow {
    position: relative; display: flex; align-items: center; gap: 8px;
    padding: 5px 12px; border-bottom: 1px solid var(--border);
    cursor: grab; min-height: var(--row-h); touch-action: pan-y;
    transition: background .12s ease;
  }
  .srow:hover { background: var(--fg-soft); }
  .srow.is-used { background: color-mix(in oklch, var(--accent) 4%, var(--surface)); }
  .srow.is-armed { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .srow.is-hot { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent-line); }
  .srow.flash { animation: flash 1.05s ease-out; }
  @keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
  body.is-dragging, body.is-dragging * { user-select: none; cursor: grabbing !important; }
  .s-main { min-width: 0; flex: 1 1 auto; }
  .s-name {
    font-family: var(--font-mono); font-size: 12.5px; font-weight: 550;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .s-name > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .s-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; min-width: 0; }
  .s-val {
    font-family: var(--font-mono); background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 5px; color: var(--muted); max-width: 120px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .s-use { flex: 0 0 auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--accent);
    border: 1px solid var(--accent-line); border-radius: 999px; padding: 0 6px; background: var(--accent-soft); }
  .type-badge {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .02em; flex: 0 0 auto;
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; color: var(--muted); background: var(--bg);
  }
  .type-badge.arr { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }
  .srow .grip-dot { flex: 0 0 auto; color: color-mix(in oklch, var(--muted) 45%, transparent); font-size: 11px; letter-spacing: -1px; }
  .srow:hover .grip-dot { color: var(--muted); }
  .tree-group {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px 4px;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--muted);
    background: var(--bg-sunken); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2;
  }
  .tree-group .spacer { flex: 1 1 auto; }
  .tree-note { padding: 10px 12px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .narrow-note { display: none; font-size: 11.5px; color: var(--muted); padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }

  /* ─── 目标账本：每个目标行内部就是一段可编辑关系 ─────────────────── */
  .tgroup {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px; position: sticky; top: 0; z-index: 3;
    background: var(--bg-sunken); border-bottom: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 10.5px; color: var(--muted);
  }
  .tgroup .spacer { flex: 1 1 auto; }
  .tgroup .gp { font-size: 11px; color: var(--muted); }
  .tgroup .gp b { color: var(--fg); font-weight: 600; }

  .trow {
    display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px 9px 11px;
    border-bottom: 1px solid var(--border); border-left: 2px solid transparent;
    transition: background .12s ease, border-color .12s ease;
  }
  .trow:hover { background: var(--fg-soft); }
  .trow.is-active { background: var(--accent-soft); border-left-color: var(--accent); }
  .trow.is-mapped { background: color-mix(in oklch, var(--accent) 3%, var(--surface)); }
  .trow.is-mapped:hover { background: color-mix(in oklch, var(--accent) 7%, var(--surface)); }
  .trow.is-linked { border-left-color: var(--accent-line); }
  .trow.is-droppable { border-left-color: var(--accent-line); background: color-mix(in oklch, var(--accent) 6%, var(--surface)); }
  .trow.is-hot { border-left-color: var(--accent); background: var(--accent-soft); }
  .trow.is-warn { border-left-color: var(--warn); }
  .trow.is-err { border-left-color: var(--danger); }
  .trow.flash { animation: flash 1.05s ease-out; }

  .t-key { flex: 0 0 236px; min-width: 0; padding-top: 1px; }
  .t-key .nm { font-family: var(--font-mono); font-size: 12.5px; font-weight: 550; display: flex; align-items: center; gap: 6px; }
  .t-key .nm .leaf { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-key .sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .req { font-size: 10px; font-family: var(--font-mono); border-radius: 4px; padding: 0 4px; flex: 0 0 auto; }
  .req.y { color: var(--danger); border: 1px solid color-mix(in oklch, var(--danger) 34%, var(--border)); }
  .req.n { color: var(--muted); border: 1px solid var(--border); }

  .t-val { flex: 1 1 auto; min-width: 0; }
  .fx {
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-height: 26px;
    padding: 2px 6px; border-radius: var(--radius); border: 1px solid transparent;
  }
  .trow.is-mapped .fx { border-color: var(--border); background: var(--surface); }
  .fx:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fx-op { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .fx-plus {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted); width: 18px; height: 18px;
    display: grid; place-items: center; border: 1px dashed var(--border); border-radius: 5px;
  }
  .fx-plus:hover { border-color: var(--accent); color: var(--accent); border-style: solid; background: var(--accent-soft); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px; max-width: 260px;
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1;
    padding: 4px 7px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--fg);
  }
  .chip .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .cd { display: none; color: var(--muted); font-size: 10px; }
  .chip:hover .cd { display: inline; }
  .chip .cd:hover { color: var(--danger); }
  .chip.field { border-color: color-mix(in oklch, var(--fg) 26%, var(--border)); }
  .chip.field .cin { color: var(--muted); font-size: 10.5px; }
  .chip.lit { border-style: dashed; color: var(--muted); background: var(--bg); }
  .chip.bad { border-color: color-mix(in oklch, var(--danger) 45%, var(--border)); color: var(--danger); }

  .addslot {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px;
    border: 1px dashed var(--border); color: var(--muted); font-size: 11.5px; background: transparent;
  }
  .addslot:hover { border-color: var(--accent); color: var(--accent); border-style: solid; background: var(--accent-soft); }
  .dropzone {
    display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 2px 8px;
    border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); font-size: 11.5px;
  }
  .trow.is-droppable .dropzone, .dropzone:hover { border-color: var(--accent-line); color: var(--fg); }

  .t-side { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding-top: 1px; }
  .src-badge {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10px;
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--muted); background: var(--bg);
  }
  .src-badge.exact { border-color: color-mix(in oklch, var(--ok) 34%, var(--border)); color: color-mix(in oklch, var(--ok) 72%, var(--fg)); }
  .src-badge.infer { border-color: color-mix(in oklch, var(--warn) 38%, var(--border)); color: color-mix(in oklch, var(--warn) 68%, var(--fg)); }
  .adapt { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
  .t-del { opacity: 0; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .trow:hover .t-del, .trow.is-active .t-del, .arow:hover .t-del, .t-del:focus-visible { opacity: 1; }
  .t-del:hover { color: var(--danger); background: color-mix(in oklch, var(--danger) 12%, transparent); }

  /* 目标数组行 */
  .arow {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px 11px 11px;
    border-bottom: 1px solid var(--border); border-left: 2px solid transparent; background: var(--bg-sunken);
  }
  .arow.is-droppable { border-left-color: var(--accent-line); background: var(--accent-soft); }
  .arow.is-hot { border-left-color: var(--accent); }
  .arow.is-warn { border-left-color: var(--warn); }
  .arow.is-err { border-left-color: var(--danger); }
  .arow .a-key { flex: 0 0 224px; min-width: 0; }
  .arow .a-key .nm { font-family: var(--font-mono); font-size: 12.5px; font-weight: 550; display: flex; align-items: center; gap: 6px; }
  .arow .a-key .sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .arow .a-map { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .arow .a-side { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

    var us = {};
    rules.forEach(function (r) {
      var k = r.scope + '|' + r.src;
      us[k] = (us[k] || 0) + 1;
      if (us[k] > 1) {
        out.push({ level: 'info', target: r.target, scope: r.scope, rule: r.id,
          msg: '同一来源字段被多处引用：' + r.src, fix: '确认是有意复用（如同时派生主字段与同步时间）' });
      }
    });
    return out;
  }
  function checkRule(r, out) {
    function bad(msg, fix) { out.push({ level: 'err', target: r.target, scope: r.scope, rule: r.id, msg: msg, fix: fix }); }
    if (r.xf !== 'INDEX' && r.xf !== 'CONSTANT' && !srcEntry(r.src, r.scope)) {
      bad('来源字段不在该作用域内：' + r.src,
        r.scope === 'top' ? '重新选择来源字段' : '组内只能用元素相对字段，跨层引用请选 $root 前缀字段');
    }
    if (r.xf === 'INDEX' && r.scope === 'top') bad('INDEX 转换只能在数组组内使用：' + r.target, '进入数组作用域后再配行号');
    if (r.xf === 'INDEX' && r.src !== '$index') bad('INDEX 转换的 source 必须为 $index：' + r.target, '把来源改为 $index');
    if (r.xf === 'ENUM' && !Object.keys(r.enumMap || {}).length) bad('枚举转换需要 enumMap：' + r.target, '在检查器中补全来源值到目标值的映射');
    if (r.xf === 'CONSTANT' && !(r.constant || '').trim()) bad('常量转换需要 constant：' + r.target, '填写常量值');
    if (r.xf === 'CONCAT' && !(r.parts || []).length) bad('CONCAT 转换需要 parts 片段：' + r.target, '至少加入一个片段');
    if (r.xf === 'CONCAT') (r.parts || []).forEach(function (p, i) {
      if (p.c == null && !p.p) bad('第 ' + (i + 1) + ' 个片段没有选择来源字段', '点该片段选择字段，或把它改成字面量');
      if (p.c != null && p.c === '') bad('第 ' + (i + 1) + ' 个字面量片段为空', '填写字面量内容');
      if (p.p && !srcEntry(p.p, r.scope)) bad('片段来源不在该作用域内：' + p.p, '重新选择该片段的字段');
    });
    if (r.xf === 'DATE' && r.datePattern === 'ISO-8601') {
      bad('ISO-8601 不是合法 pattern，运行期会抛 Unknown pattern letter: I', "改为 yyyy-MM-dd'T'HH:mm:ss");
    } else if (r.xf === 'DATE' && r.datePattern && !/^[yMdHmsT:/\-. ]+$/.test(r.datePattern)) {
      bad('日期格式不是合法的 DateTimeFormatter pattern：' + r.datePattern, '改为 yyyy-MM-dd 等合法格式');
    }
    if (r.iterate && r.iterate !== 'FOR_EACH') bad('iterate 只支持 FOR_EACH：' + r.iterate, '改为 FOR_EACH');
  }
  function ruleIssues(id) { return diagnostics().filter(function (d) { return d.rule === id; }); }

  /* ══════════════ 渲染：来源树 ══════════════════════════════════════════ */
  function renderSrc() {
    var list = srcFields(state.scope), used = usedSources(), q = norm(state.query), out = [], lastGroup = null;
    list.forEach(function (f) {
      var n = used[f.l] || 0;
      if (state.srcFilter === 'unused' && n) return;
      if (q && norm(f.l).indexOf(q) < 0 && norm(f.leaf).indexOf(q) < 0) return;
      var grp = f.root ? '跨层引用 $root' : (f.arr ? '数组（可作 FOR_EACH 来源）' : '');
      if (grp && grp !== lastGroup) {
        out.push('<div class="tree-group">' + grp + '<span class="spacer"></span></div>');
        lastGroup = grp;
      }
      var cls = ['srow'];
      if (n) cls.push('is-used');
      if (state.armed && state.armed.path === f.l) cls.push('is-armed');
      if (state.hot && rules.some(function (r) {
        return r.scope === state.scope && r.target === state.hot && ruleUsesSource(r, f.l);
      })) cls.push('is-hot');
      out.push('<div class="' + cls.join(' ') + '" data-src="' + esc(f.l) + '" tabindex="0" role="button" ' +
        'aria-label="来源字段 ' + esc(f.l) + (n ? '，已用于 ' + n + ' 处' : '') + '">' +
        '<span class="grip-dot" aria-hidden="true">⠿</span>' +
        '<div class="s-main"><div class="s-name"><span>' + esc(f.root ? '$root.' + f.leaf : f.leaf) + '</span>' +
          '<span class="type-badge' + (f.arr ? ' arr' : '') + '">' + (f.arr ? 'ARRAY[' + f.v + ']' : f.t) + '</span>' +
          (n ? '<span class="s-use">' + n + ' 处</span>' : '') + '</div>' +
        (state.srcMode === 'detail' ? '<div class="s-meta"><span class="s-val">' + esc(fmt(f.v)) + '</span></div>' : '') +
        '</div></div>');
    });
    if (!out.length) out.push('<div class="tree-note">没有匹配的字段。换个关键字，或把范围切回「全部」。</div>');
    if (state.scope !== 'top') {
      out.push('<div class="tree-note">组内来源用元素相对路径；需要外层头字段时选「跨层引用 $root」里的字段。</div>');
    }
    $('srcTree').innerHTML = out.join('');
  }

  /* ══════════════ 渲染：目标账本（每行内部就是一段可编辑关系） ════════ */
  function renderTgt() {
    var scope = state.scope, out = [];
    out.push('<div class="tgroup">目标对象 mes.bom<span class="spacer"></span>' + progressText(scope) + '</div>');
    tgtFields(scope).forEach(function (t) { out.push(t.arr ? arrayRow(t, scope) : leafRow(t, scope)); });
    $('tgtList').innerHTML = out.join('');
    $('tgtClass').textContent = scope === 'top' ? 'mes.bom' : leaf(scope) + '[] 元素';
    $('tgtPaneSub').textContent = scope === 'top'
      ? 'HTTP 请求体 · ' + tgtFields('top').length + ' 个字段'
      : '元素相对路径 · 来源数组 ' + ((hostRule(scope) || {}).src || '—');
  }
  function progressText(scope) {
    var ts = tgtFields(scope);
    var mapped = ts.filter(function (t) { return !!ruleForTarget(t.l, scope); }).length;
    return '<span class="gp">已映射 <b>' + mapped + '</b> / ' + ts.length + '</span>';
  }

  function leafRow(t, scope) {
    var r = ruleForTarget(t.l, scope);
    var issues = r ? ruleIssues(r.id) : [];
    var lv = issues.some(function (i) { return i.level === 'err'; }) ? 'err'
           : issues.some(function (i) { return i.level === 'warn'; }) ? 'warn' : '';
    var cls = ['trow'];
    if (r) cls.push('is-mapped');
    if (r && state.sel === r.id) cls.push('is-active');
    if (state.hot === t.l) cls.push('is-hot');
    if (drag && drag.hot === t.l) cls.push('is-droppable');
    if (lv) cls.push('is-' + lv);

    var val;
    if (r) {
      val = fxHtml(r);
    } else {
      val = '<div class="dropzone">' +
        (scope !== 'top' && t.l === 'lineNo'
          ? '<button class="addslot" data-quick="index">＋ 用 $index 生成行号</button>'
          : '<button class="addslot" data-quick="' + esc(t.l) + '">＋ 选择来源字段</button>') +
        '<span>未映射</span></div>';
    }

    var side = ['<span class="req ' + (t.req ? 'y' : 'n') + '">' + (t.req ? '必填' : '可选') + '</span>'];
    var adapt = r ? adaptHint(r) : null;
    if (adapt) side.push(adapt);
    if (r && r.origin !== 0) {
      side.push('<span class="src-badge ' + (r.origin === 1 ? 'exact' : 'infer') + '" title="' +
        (r.origin === 1 ? '精确同名' : '推断') + '：确认为人工确认后写入历史，下个同类任务可复用">' +
        (r.origin === 1 ? '同名' : '推断') + '</span>');
    }
    if (r) side.push('<button class="t-del" data-rm="' + r.id + '" aria-label="删除该关系">✕</button>');

    return '<div class="' + cls.join(' ') + '" data-tgt="' + esc(t.l) + '" data-tid="' + (r ? r.id : '') + '" tabindex="0">' +
      '<div class="t-key"><div class="nm"><span class="leaf">' + esc(t.l) + '</span>' +
        '<span class="type-badge">' + t.k + '</span></div>' +
        (t.hint ? '<div class="sub">' + esc(t.hint) + '</div>' : '') + '</div>' +
      '<div class="t-val">' + val + '</div>' +
      '<div class="t-side">' + side.join('') + '</div></div>';
  }

  function arrayRow(t, scope) {
    var r = ruleForTarget(t.l, scope);
    var kids = rules.filter(function (c) { return c.scope === t.l; });
    var total = (t.arr.fields || []).length, mapped = kids.length;
    var issues = r ? ruleIssues(r.id) : [];
    var lv = issues.some(function (i) { return i.level === 'err'; }) ? 'err'
           : issues.some(function (i) { return i.level === 'warn'; }) ? 'warn' : '';
    var cls = ['arow'];
    if (state.hot === t.l) cls.push('is-hot');
    if (drag && drag.hot === t.l) cls.push('is-droppable');
    if (lv) cls.push('is-' + lv);
    var map = r
      ? '<span class="iterate-pill">FOR_EACH</span>' +
        '<span class="chip field" style="cursor:default">' + esc(r.src) + '</span>' +
        '<span class="a-progress"><span class="prog-bar"><i style="width:' +
          Math.round(mapped / Math.max(total, 1) * 100) + '%"></i></span>' +
        '<span class="prog-txt"><b>' + mapped + '</b>/' + total + ' 元素字段</span></span>'
      : '<button class="addslot" data-quick="' + esc(t.l) + '">＋ 选择来源数组</button>' +
        '<span style="color:var(--muted);font-size:11.5px">未映射</span>';
    return '<div class="' + cls.join(' ') + '" data-arrtgt="' + esc(t.l) + '" data-tid="' + (r ? r.id : '') + '">' +
      '<div class="a-key"><div class="nm">' + esc(t.l) +
        '<span class="type-badge arr">ARRAY[' + total + ']</span></div>' +
        '<div class="sub">' + esc(t.hint || '目标数组') + '</div></div>' +
      '<div class="a-map">' + map + '</div>' +
      '<div class="a-side"><span class="req ' + (t.req ? 'y' : 'n') + '">' + (t.req ? '必填' : '可选') + '</span>' +
        (r ? '<button class="btn btn-sm" data-enter="' + esc(t.l) + '">进入作用域</button>' +
             '<button class="t-del" data-rm="' + r.id + '" aria-label="删除数组关系">✕</button>' : '') +
      '</div></div>';
  }

  /* 一行目标的关系表达式：字段 chip 与字面量 chip —— 关系本身就是可编辑内容。 */
  function fxHtml(r) {
    if (r.xf === 'CONSTANT') {
      return '<div class="fx" data-fx="' + r.id + '">' + chipLit(r.constant || '', r.id, null) + xfTail(r) + '</div>';
    }
    if (r.xf === 'CONCAT') {
      var items = (r.parts || []).map(function (p, i) {
        return p.c != null ? chipLit(p.c, r.id, i) : chipField(p.p, r.id, i);
      });
      var body = items.length ? items.join('<span class="fx-op">&amp;</span>') : '<span class="fx-op">片段为空</span>';
      return '<div class="fx" data-fx="' + r.id + '">' + body + addBtn(r) + xfTail(r) + '</div>';
    }
    if (r.xf === 'INDEX') {
      return '<div class="fx" data-fx="' + r.id + '"><span class="chip" style="cursor:default">$index</span>' +
        '<span class="fx-op">＋</span><span class="chip" style="cursor:default">起始 ' +
        (r.startAt == null ? 1 : r.startAt) + '</span>' + xfTail(r) + '</div>';
    }
    return '<div class="fx" data-fx="' + r.id + '">' + chipField(r.src, r.id, null) + xfTail(r) + '</div>';
  }
  function chipField(path, ruleId, partIdx) {
    var pi = partIdx == null ? '' : partIdx;
    if (!path) return '<button class="chip field bad" data-chip="' + ruleId + '" data-part="' + pi + '">选择字段</button>';
    var isRoot = path.indexOf('$root') === 0;
    return '<button class="chip field" data-chip="' + ruleId + '" data-part="' + pi + '" title="' + esc(path) + '">' +
      '<span class="cin">' + (isRoot ? '../' : '') + '</span><span class="ct">' +
      esc(isRoot ? leaf(path) : path) + '</span>' +
      '<span class="cd" data-unset="' + ruleId + '" data-part="' + pi + '" role="button" aria-label="移除该字段">✕</span></button>';
  }
  function chipLit(v, ruleId, partIdx) {
    var pi = partIdx == null ? '' : partIdx;
    return '<button class="chip lit" data-lit="' + ruleId + '" data-part="' + pi + '" title="字面量片段">"' +
      esc(v === '' ? '空' : v) + '"' +
      '<span class="cd" data-unset="' + ruleId + '" data-part="' + pi + '" role="button" aria-label="移除该片段">✕</span></button>';
  }
  function addBtn(r) {
    return '<button class="fx-plus" data-addpart="' + r.id + '" aria-label="加入一个片段（字段或字面量）">＋</button>';
  }
  function xfTail(r) { return '<span class="fx-op" style="margin-left:2px">· ' + xfName(r.xf) + '</span>'; }

  /* 类型适配提示：来源类型与目标类型不匹配时给一键转换。 */
  function adaptHint(r) {
    if (r.xf === 'CONSTANT' || r.xf === 'INDEX' || r.xf === 'CONCAT') return null;
    var f = srcEntry(r.src, r.scope), t = null, i, ts = tgtFields(r.scope);
    for (i = 0; i < ts.length; i++) if (ts[i].l === r.target) t = ts[i];
    if (!f || !t || !t.k || f.t === 'ARRAY' || t.k === 'ARRAY') return null;
    var from = f.t, to = t.k;
    var compat = from === to || to === 'STRING' ||
      (from === 'INT' && to === 'NUMBER') || (from === 'NUMBER' && to === 'INT' && r.xf === 'INT');
    if (compat) return null;
    var suggest = (to === 'INT' || to === 'NUMBER') ? 'INT' : (to === 'DATE' ? 'DATE' : 'STRING');
    return '<span class="adapt">' + from + ' → ' + to + '</span>' +
      '<button class="btn btn-adapt" data-fix="' + r.id + '" data-xf="' + suggest +
      '" title="把转换改为「' + xfName(suggest) + '」以匹配目标类型">转为' + xfName(suggest) + '</button>';
  }

  /* ══════════════ 渲染：连线层（只在悬停 / 选中时实体化） ═══════════════ */
  function syncWires() {
    var frame = $('frame'), zone = $('wirezone'), svg = $('wires');
    if (!frame || !zone || window.innerWidth <= 1180 || zone.getBoundingClientRect().width < 2) {
      svg.innerHTML = '';
      $('wireHint').hidden = rules.length > 0;
      return;
    }
    var fr = frame.getBoundingClientRect(), zr = zone.getBoundingClientRect();
    svg.setAttribute('width', zr.width);
    svg.setAttribute('height', fr.height);
    svg.setAttribute('viewBox', '0 0 ' + zr.width + ' ' + fr.height);

    var hotId = null, hr;
    if (state.hot) { hr = ruleForTarget(state.hot, state.scope); if (hr) hotId = hr.id; }
    if (state.sel) hotId = state.sel;

    var parts = [];
    scopedRules().forEach(function (r) {
      var sEl = $('srcTree').querySelector('[data-src="' + srcFull(r.scope, r.src) + '"]');
      var tEl = $('tgtList').querySelector('[data-tgt="' + r.target + '"], [data-arrtgt="' + r.target + '"]');
      if (!sEl || !tEl) return;
      var sr = sEl.getBoundingClientRect(), tr = tEl.getBoundingClientRect();
      var y1 = sr.top + sr.height / 2 - fr.top, y2 = tr.top + 26 - fr.top;
      if (y1 < -24 || y2 < -24 || y1 > fr.height + 24 || y2 > fr.height + 24) return;
      var x1 = sr.right - fr.left - 4, x2 = tr.left - fr.left + 5;
      var dx = Math.max(24, (x2 - x1) * 0.5);
      var d = 'M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ', ' + (x2 - dx) + ' ' + y2 + ', ' + x2 + ' ' + y2;
      var live = hotId === r.id, dim = hotId != null && !live;
      parts.push('<path class="wire' + (live ? ' live' : ' solid') + (dim ? ' dim' : '') +
        '" d="' + d + '" data-rule="' + r.id + '"/>');
      parts.push('<path class="rhit" d="' + d + '" data-rule="' + r.id + '"/>');
      parts.push('<circle class="fdot' + (live ? ' on' : '') + '" cx="' + x1 + '" cy="' + y1 + '" r="' + (live ? 4 : 3) + '"/>');
      parts.push('<circle class="fdot' + (live ? ' on' : '') + '" cx="' + x2 + '" cy="' + y2 + '" r="' + (live ? 4 : 3) + '"/>');
      if (live) {
        parts.push('<circle class="flow" r="3"><animateMotion dur="1.6s" repeatCount="indefinite" path="' + d + '"/></circle>');
      }
    });
    svg.innerHTML = parts.join('');
    $('wireHint').hidden = parts.length > 0;
  }

  /* ══════════════ 渲染：诊断 ═══════════════════════════════════════════ */
  function renderDiag() {
    var d = diagnostics();
    var errs = d.filter(function (x) { return x.level === 'err'; }).length;
    var warns = d.filter(function (x) { return x.level === 'warn'; }).length;
    $('diagDot').className = 'dot' + (errs ? ' err' : warns ? ' warn' : '');
    $('diagText').innerHTML = errs
      ? '<b style="color:var(--danger)">' + errs + ' 个错误</b> <em>· 保存会被拦截（对应后端写时 400）</em>'
      : warns ? '<b>' + warns + ' 项提示</b> <em>· 不阻断保存与启用</em>'
      : '校验通过 <em>· ' + rules.length + ' 条关系全部可编译</em>';
    $('diagBody').innerHTML = d.length ? d.map(function (x, i) {
      return '<button class="diag-item ' + x.level + '" data-diag="' + i + '">' +
        '<span class="lvl">' + (x.level === 'err' ? '错误' : x.level === 'warn' ? '提示' : '说明') + '</span>' +
        '<span class="msg">' + esc(x.msg) + '<br><span class="fix">→ ' + esc(x.fix) + '</span></span></button>';
    }).join('')
      : '<div class="diag-item info"><span class="lvl">通过</span><span class="msg">没有发现问题。</span></div>';
    $('diagBody').style.display = state.diagOpen ? '' : 'none';
    $('diagToggle').textContent = state.diagOpen ? '收起明细' : '展开明细（' + d.length + '）';
    $('diagToggle').setAttribute('aria-expanded', String(state.diagOpen));
    $('toggleDiag').setAttribute('aria-pressed', String(state.diagOpen));

    var ts = tgtFields(state.scope);
    var need = ts.filter(function (t) { return t.req; });
    var done = need.filter(function (t) { return !!ruleForTarget(t.l, state.scope); });
    $('progFill').style.width = (need.length ? Math.round(done.length / need.length * 100) : 100) + '%';
    $('progTxt').innerHTML = (state.scope === 'top' ? '顶层' : leaf(state.scope)) +
      ' 必填 <b>' + done.length + '</b>/' + need.length;
  }

  /* ══════════════ 渲染：编译预览 ═══════════════════════════════════════ */
  function renderPreview() {
    $('drawerBody').innerHTML = '<div class="pv-cols">' +
      '<div><div class="pv-h">映射结果（目标请求体）</div><pre class="json">' + resultJson() + '</pre></div>' +
      '<div><div class="pv-h">编译后 JSONata（JsonataRuleCompiler）</div><pre class="json">' + esc(compiledTree()) + '</pre></div>' +
      '</div>';
    var top = rules.filter(function (r) { return r.scope === 'top'; }).length;
    $('previewSub').textContent = rules.length + ' 条关系 · 顶层 ' + top + ' + 组内 ' + (rules.length - top) +
      ' · 未映射字段不会出现在请求体中';
  }
  function resultJson() {
    var entries = [];
    TGT.fields.forEach(function (t) {
      var r, g, rows, sourceArr, kids;
      if (t.l) {
        r = ruleForTarget(t.l, 'top');
        if (!r) return;
        entries.push('  ' + kv(t.l, evalRule(r)));
        return;
      }
      g = ruleForTarget(t.g, 'top');
      if (!g) return;
      sourceArr = SOURCE_JSON.erpBom[t.g];
      if (!Array.isArray(sourceArr)) {
        entries.push('  ' + kv(t.g, null, '  [ 来源样例中无 ' + esc(g.src) + '，无法演示求值 ]'));
        return;
      }
      kids = rules.filter(function (c) { return c.scope === t.g; });
      rows = sourceArr.map(function (item, idx) {
        var props = [];
        kids.forEach(function (k) {
          var v;
          if (k.xf === 'INDEX') v = (k.startAt == null ? 1 : k.startAt) + idx;
          else if (k.xf === 'ENUM') v = (k.enumMap || {})[String(item[k.src])];
          else if (k.xf === 'CONSTANT') v = k.constant;
          else v = item[k.src];
          if (k.xf === 'INT' && v !== undefined) v = Math.trunc(Number(v));
          if (v === undefined) return;
          props.push('      ' + kv(k.target, v));
        });
        return '    {<br>' + props.join(',<br>') + '<br>    }';
      });
      entries.push('  ' + kv(t.g, null, '  [<br>' + rows.join(',<br>') + '<br>  ]'));
    });
    return '{<br>' + entries.join(',<br>') + '<br>}';
  }
  function kv(k, v, raw) {
    var val = raw !== undefined ? raw
      : v === null ? '<span class="val-null">null</span>'
      : typeof v === 'number' ? '<span class="n">' + v + '</span>'
      : '<span class="s">"' + esc(String(v)) + '"</span>';
    return '<span class="k">"' + esc(String(k)) + '"</span>: ' + val;
  }

  /* ══════════════ 渲染：检查器（参数 / 求值 / 编译 / 该关系的问题） ══════ */
  function renderInspector() {
    var body = $('inspBody'), foot = $('inspFoot');
    $('inspector').classList.toggle('open', state.inspOpen);
    var r = state.sel != null ? ruleOf(state.sel) : null;
    if (!r) {
      $('inspTitle').textContent = '未选中关系';
      $('inspRuleId').textContent = '点目标行里的字段 chip';
      body.innerHTML = '<div class="empty-insp"><b>选一条关系</b>' +
        '点目标行里任意一个 chip 打开这里：改转换类型、配参数，并实时看样例求值与编译结果。<br><br>' +

  function xfHint(r) {

  /* ══════════════ 选择器弹层 ═══════════════════════════════════════════ */
  var pop = null;

    var used = usedSources(scope), out = [], grp = null;

      var g = f.root ? '跨层引用（$root → $s_1）' : f.t === 'ARRAY' ? '数组（可作 FOR_EACH 来源）' : null;
      if (g && g !== grp) { out.push('<div class="pop-grp">' + g + '</div>'); grp = g; }
      var n = used[f.l] || 0;

        '<span class="type-badge' + (f.t === 'ARRAY' ? ' arr' : '') + '">' + (f.t === 'ARRAY' ? 'ARRAY' : f.t) + '</span>' +
        '<span class="pi-t">' + esc(f.l) + '</span>' +

  }

  /* 改某条关系 / 某个片段的来源字段。 */

      '<input class="q" placeholder="搜索" aria-label="搜索字段" /></div>' +
      '<div class="pop-list"></div>' +

  /* 未预选来源时的快速建立：先选字段，落成关系。 */

  /* ══════════════ 关系动作 ═════════════════════════════════════════════ */
  function upsert(source, target, scope, verb, extra) {

    r = { id: ++uid, scope: scope, target: target, src: source, xf: 'STRING', origin: 0 };
    for (k in (extra || {})) r[k] = extra[k];
    rules.push(r);
    selectRule(r.id, true);

  /* ══════════════ 拖拽：整行即手柄 ════════════════════════════════════ */
  var drag = null, pending = null, suppress = false;

  function beginDrag(dir, path, isArr, target) {

  }
  function endDrag() {

  function dragAnchor() {

      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      setW(Math.max(200, Math.min(420, curW() + (e.key === 'ArrowRight' ? 16 : -16))));
    });
  })();

  /* ══════════════ 提示 ═════════════════════════════════════════════════ */
  function toast(html, withAction) {
    var box = document.createElement('div');
    box.className = 'toast';
    box.innerHTML = '<span class="tk">' + html + '</span>' +
      (withAction ? '<button data-toast-unused="1">只看未使用来源</button>' : '');
    $('toasts').appendChild(box);
    if (withAction) {
      box.querySelector('[data-toast-unused]').addEventListener('click', function () {
        state.srcFilter = 'unused';
        document.querySelectorAll('[data-scope]').forEach(function (x) {
          x.setAttribute('aria-pressed', String(x.getAttribute('data-scope') === 'unused'));
        });
        renderSrc();
        box.remove();
      });
    }
    setTimeout(function () { box.remove(); }, withAction ? 6500 : 3600);
  }

  /* ══════════════ 渲染入口 ═════════════════════════════════════════════ */
  /* 输入时的局部刷新：只更新受影响的节点，避免输入框失焦。 */
  function softRefresh() {
    renderPreview();
    renderDiag();
    var r = ruleOf(state.sel);
    if (!r) {
      renderInspector();
    } else {
      if ($('evalBox')) $('evalBox').innerHTML = evalTableHtml(r);
      if ($('exprBox')) $('exprBox').textContent = selfExpr(r);
      if ($('inspDiag')) $('inspDiag').innerHTML = inspDiagHtml(r);
      renderTgt();
      markHot();
      if (!ruleOf(state.sel)) renderInspector();
    }
    syncWires();
  }
  function syncUiChrome() {
    document.querySelectorAll('[data-srcmode]').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x.getAttribute('data-srcmode') === state.srcMode));
    });
    document.querySelectorAll('[data-scope]').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x.getAttribute('data-scope') === state.srcFilter));
    });
    $('drawer').classList.toggle('open', state.drawerOpen);
    document.querySelector('[data-toggle="drawer"]').setAttribute('aria-pressed', String(state.drawerOpen));
  }
  function renderAll() {
    renderSrc();
    renderTgt();
    renderPreview();
    renderDiag();
    renderInspector();
    syncUiChrome();

    var bar = $('scopeBar'), chain = scopeChain(state.scope), g0;
    bar.hidden = state.scope === 'top';
    if (state.scope !== 'top') {
      var html = chain.map(function (s, i) {
        var g = ruleForTarget(s, parentScope(s));
        return '<button class="crumb' + (i === chain.length - 1 ? ' is-here' : '') +
          '" data-goto="' + esc(i === 0 ? 'top' : chain[i - 1]) + '">' + esc(leaf(s)) +
          (g ? '<span class="csep">← ' + esc(leaf(g.src)) + '</span>' : '') + '</button>';
      }).join('');
      $('scopeCrumbs').innerHTML = '<button class="crumb" data-goto="top">$s_1 顶层</button>' + html;
      g0 = hostRule(state.scope);
      $('sbNote').innerHTML = g0
        ? '来源数组 <code>' + esc(g0.src) + '</code> · 元素用相对路径，跨层用 $root'
        : '尚无来源数组';
    }
    $('srcPaneHead').innerHTML = state.scope === 'top'
      ? '来源字段 <code>$s_1</code>'
      : '元素字段 <code>$g' + (scopeDepth(state.scope) - 1) + '</code>';
    $('srcPaneSub').textContent = state.scope === 'top'
      ? 'db:erp_bom 探测样例 · ' + srcFields('top').length + ' 个字段'
      : '来源数组 ' + ((hostRule(state.scope) || {}).src || '—') + ' 的元素';
    markHot();
    updateArmed();
    requestAnimationFrame(syncWires);
  }
  function updateArmed() {
    var bar = $('armed');
    if (state.armed) {
      bar.hidden = false;
      $('armedText').innerHTML = '已选 ' + (state.armed.isArr ? '数组 ' : '') +
        '<code>' + esc(state.armed.path) + '</code> · 点目标行的「＋」';
    } else if (drag) {
      bar.hidden = false;
      $('armedText').innerHTML = '拖动 <code>' + esc(drag.dir === 'src' ? drag.path : drag.target) + '</code> · 松手落点 · Esc 取消';
    } else {
      bar.hidden = true;
    }
  }
  $('armedCancel').addEventListener('click', function () {
    if (drag) { endDrag(); return; }
    state.armed = null;
    renderAll();
  });

  var ro = new ResizeObserver(function () { syncWires(); });
  ro.observe($('frame'));
  ro.observe($('srcScroll'));
  ro.observe($('tgtScroll'));
  ro.observe($('inspector'));
  $('srcScroll').addEventListener('scroll', syncWires);
  $('tgtScroll').addEventListener('scroll', syncWires);
  window.addEventListener('resize', syncWires);

  loadUi();
  renderAll();
  window.addEventListener('load', syncWires);
})();
</script>
</body>
</html>
