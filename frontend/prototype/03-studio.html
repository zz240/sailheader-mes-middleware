<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>字段映射 · 关系账本 — edge-gateway 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23252b30'/%3E%3Ctext x='8' y='11.5' font-size='8' font-family='monospace' fill='%233fae7a' text-anchor='middle'%3E%E2%86%92%3C/text%3E%3C/svg%3E" />
<style>
  /* ─── 令牌：沿用已锁定的技术工具向色板（深浅两级中性 + 单一信号色） ─── */
  :root {
    --bg:      oklch(98% 0.005 250);
    --surface: oklch(100% 0 0);
    --fg:      oklch(22% 0.02 240);
    --muted:   oklch(50% 0.018 240);
    --border:  oklch(90% 0.008 240);
    --accent:  oklch(48% 0.15 150);

    --accent-soft:   color-mix(in oklch, var(--accent) 12%, transparent);
    --accent-line:   color-mix(in oklch, var(--accent) 52%, transparent);
    --accent-strong: color-mix(in oklch, var(--accent) 86%, black);
    --fg-soft:       color-mix(in oklch, var(--fg) 5%, transparent);
    --fg-tint:       color-mix(in oklch, var(--fg) 9%, transparent);
    --bg-sunken:     color-mix(in oklch, var(--bg) 62%, var(--surface));
    --warn:   oklch(58% 0.14 70);
    --danger: oklch(54% 0.18 27);
    --warn-soft:   color-mix(in oklch, var(--warn) 14%, transparent);
    --danger-soft: color-mix(in oklch, var(--danger) 11%, transparent);
    /* 小字号下的告警/错误文字色：提到 4.5:1 以上，浅底上也能读 */
    --warn-ink:   color-mix(in oklch, var(--warn) 66%, black);
    --danger-ink: color-mix(in oklch, var(--danger) 82%, black);

    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

    --fs-body: 13.5px;
    --fs-meta: 11.5px;
    --radius: 8px;
    --radius-lg: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  input { font: inherit; color: inherit; }
  p { margin: 0; }
  code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h1, h2 { font-family: var(--font-display); margin: 0; }
  ::selection { background: var(--accent-soft); }

  /* ─── 按钮 ─────────────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; min-height: 30px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); color: var(--fg);
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn:hover { background: var(--fg-soft); border-color: color-mix(in oklch, var(--fg) 32%, var(--border)); }
  .btn:active { transform: translateY(.5px); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--surface); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--fg-soft); color: var(--fg); }
  .btn-sm { padding: 4px 9px; min-height: 26px; font-size: 11.5px; }
  .ico { width: 14px; height: 14px; flex: 0 0 auto; }
  .spacer { flex: 1 1 auto; }

  /* ─── 应用条 / 页头 ───────────────────────────────────────────────── */
  .appbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
    padding: 9px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 650; letter-spacing: -.01em; font-size: 14px; }
  .brand span { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11.5px; margin-left: 6px; }
  .crumbs { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .crumbs b { color: var(--fg); font-weight: 550; }
  .crumbs .sep { color: color-mix(in oklch, var(--muted) 55%, transparent); }
  .appbar .right { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--bg); }
  kbd.kbd { border-bottom-width: 2px; }

  .pagehead { flex: 0 0 auto; padding: 13px 18px 0; }
  .title-row { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 620; letter-spacing: -.015em; }
  .subline { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .subline code { color: var(--fg); font-size: 11.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .arrow { color: var(--muted); font-family: var(--font-mono); }
  .meter { display: flex; align-items: center; gap: 8px; }
  .meter-bar { width: 96px; height: 6px; border-radius: 3px; background: var(--fg-tint); overflow: hidden; }
  .meter-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s ease; }
  .meter-txt { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .meter-txt b { color: var(--fg); font-weight: 600; }
  .title-row .right { margin-left: auto; display: flex; align-items: center; gap: 9px; }

  /* ─── 工作区骨架 ─────────────────────────────────────────────────── */
  .workspace { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 18px 14px; }
  .stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .phead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sunken); min-height: 50px; }
  .phead .pt { font-size: 12.5px; font-weight: 620; display: flex; align-items: center; gap: 7px; }
  .phead .pt code { font-size: 11px; font-weight: 500; color: var(--muted); }
  .phead .ps { font-size: 11px; color: var(--muted); }
  .phead .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .scroll { flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; }

  /* ─── 来源字段货架 ───────────────────────────────────────────────── */
  .shelf { flex: 0 0 286px; min-width: 0; }
  .search { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 11.5px; }
  .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fsrc { font-family: var(--font-mono); font-size: 11.5px; padding: 7px 12px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface); display: flex; gap: 6px; flex-wrap: wrap; }
  .fsrc code { color: var(--fg); }
  .fhint { font-family: var(--font-body); font-size: 10.5px; color: var(--muted); flex: 1 0 100%; }
  .tree { padding: 4px 0 10px; }
  .tgroup > .trow { font-weight: 600; }
  .trow {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 7px;
    padding: 4px 12px 4px 10px; min-height: 30px; cursor: grab;
    border-left: 2px solid transparent;
  }
  .trow:hover { background: var(--fg-soft); border-left-color: var(--accent); }
  .trow.used { background: color-mix(in oklch, var(--accent) 5%, transparent); }
  .trow.used .tpath { color: var(--fg); }
  .trow .twist { width: 14px; height: 14px; display: grid; place-items: center; color: var(--muted); font-size: 9px; }
  .trow .tmain { min-width: 0; }
  .tpath { font-family: var(--font-mono); font-size: 12px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow:not(.used) .tpath { color: color-mix(in oklch, var(--fg) 74%, var(--muted)); }
  .tsample { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .trow .tright { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .ttype { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .03em; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; text-transform: uppercase; }
  .tcount { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg); background: var(--fg-tint); border-radius: 999px; padding: 1px 5px; }
  .tleaf { padding-left: 10px; }
  .shelf-empty { padding: 18px 12px; color: var(--muted); font-size: 12px; text-align: center; }

  /* ─── 关系账本 ───────────────────────────────────────────────────── */
  .ledger { flex: 1 1 auto; min-width: 0; }
  .toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { padding: 5px 11px; min-height: 28px; font-size: 12px; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--fg-tint); color: var(--fg); font-weight: 600; }
  .seg button:hover { background: var(--fg-soft); color: var(--fg); }
  .hint { font-size: 11.5px; color: var(--muted); }
  .hint code { color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 11px; }

  .ledger-head {
    display: grid; grid-template-columns: 190px minmax(0, 1fr) 190px 26px; gap: 10px;
    padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
  }
  .ledger-body { position: relative; flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; padding-bottom: 8px; }

  .mrow { border-bottom: 1px solid color-mix(in oklch, var(--border) 70%, transparent); }
  .mline {
    position: relative; display: grid; grid-template-columns: 190px minmax(0, 1fr) 190px 26px; gap: 10px;
    align-items: center; padding: 6px 12px; min-height: 46px; cursor: default;
  }
  .mrow:hover > .mline { background: var(--bg-sunken); }
  .mrow.sel > .mline::before { content: ''; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .mline.drop { outline: 1.5px dashed var(--accent); outline-offset: -3px; background: var(--accent-soft); }
  .mline.drop-bad { outline: 1.5px dashed var(--danger); outline-offset: -3px; background: var(--danger-soft); }
  .mrow.unmapped > .mline { background: color-mix(in oklch, var(--warn) 5%, transparent); }

  .mt { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .mt .tw { width: 15px; height: 15px; flex: 0 0 auto; color: var(--muted); font-size: 9px; display: grid; place-items: center; border-radius: 4px; }
  .mt .tw:hover { background: var(--fg-tint); color: var(--fg); }
  .mt .tpath { font-size: 12.5px; font-weight: 560; }
  .mt .req { color: var(--danger); font-size: 11px; line-height: 1; }
  .mt .ttype { flex: 0 0 auto; }

  .me { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-width: 0; min-height: 26px; border-radius: 6px; }
  .me:hover { background: color-mix(in oklch, var(--fg) 3%, transparent); }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px;
    border-radius: 6px; border: 1px solid var(--border); background: var(--fg-soft);
    font-family: var(--font-mono); font-size: 12px; color: var(--fg); white-space: nowrap; max-width: 100%;
  }
  .chip:hover { border-color: color-mix(in oklch, var(--fg) 34%, var(--border)); background: var(--fg-tint); }
  .chip .ell { overflow: hidden; text-overflow: ellipsis; }
  .chip.l { border-style: dashed; color: var(--muted); }
  .chip.l:hover { color: var(--fg); }
  .chip.op, .chip.lk, .chip.idx { background: var(--surface); font-weight: 600; }
  .chip.lk { font-weight: 500; }
  .chip.slot {
    border-style: dashed; background: transparent; color: var(--muted);
    font-family: var(--font-body); font-size: 11.5px; height: 26px; padding: 0 10px;
  }
  .chip.slot:hover { color: var(--fg); border-color: var(--fg); background: var(--surface); }
  .chip.hot { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
  .chip.err { border-color: color-mix(in oklch, var(--danger) 55%, var(--border)); color: var(--danger); }
  .chip.warn { border-color: color-mix(in oklch, var(--warn) 55%, var(--border)); }
  .pn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .amp { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding: 0 1px; }

  .mv { display: flex; align-items: center; gap: 6px; min-width: 0; justify-content: flex-end; font-family: var(--font-mono); font-size: 12px; }
  .mv .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .mv.ok .val { color: var(--fg); }
  .mv.ok::before { content: '→'; color: var(--muted); flex: 0 0 auto; }
  .mv.miss .val, .mv.err .val { color: var(--danger); }
  .mv.miss::before, .mv.err::before { content: '→'; color: var(--muted); flex: 0 0 auto; }
  .mv.arr .val { color: var(--fg); }
  .mv .flag { font-family: var(--font-body); font-size: 10px; color: var(--warn); border: 1px solid var(--warn-soft); background: var(--warn-soft); border-radius: 4px; padding: 0 4px; flex: 0 0 auto; }
  .mv .tick { color: var(--accent); flex: 0 0 auto; font-size: 11px; }
  .mv .idle { color: var(--muted); font-family: var(--font-body); font-size: 11.5px; }
  /* 试算值可点：跳到抽屉里的试算证据 */
  button.mv { border: 0; background: transparent; padding: 3px 6px; margin: -3px -6px; border-radius: 6px; }
  button.mv:hover { background: var(--fg-soft); }
  button.mv:hover .val { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
  .tnode.hit, .tnode.hit:hover { background: var(--accent-soft); }
  .mact { display: flex; justify-content: flex-end; }
  .mact button { width: 22px; height: 22px; border-radius: 5px; color: var(--muted); opacity: 0; display: grid; place-items: center; font-size: 13px; }
  .mrow:hover .mact button, .mact button:focus-visible { opacity: 1; }
  .mact button:hover { background: var(--fg-tint); color: var(--fg); }

  .mchildren { margin-left: 18px; border-left: 1px solid var(--border); }
  .rail { padding: 5px 12px 5px 14px; font-size: 11px; color: var(--muted); background: var(--surface); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rail code { color: var(--fg); }

  .badge { font-family: var(--font-body); font-size: 9.5px; letter-spacing: .02em; border-radius: 4px; padding: 1px 5px; border: 1px solid var(--border); color: var(--muted); flex: 0 0 auto; }
  .badge.auto { border-color: var(--accent-line); color: var(--accent); }
  .badge.man { color: var(--muted); }

  /* ─── 行内编辑面板 ───────────────────────────────────────────────── */
  .mpanel { border-top: 1px dashed var(--border); background: var(--bg-sunken); padding: 10px 12px 12px; }
  .mpanel .prow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .mpanel .plabel { font-size: 11.5px; color: var(--muted); }
  .mpanel .plabel b { color: var(--fg); font-weight: 600; }
  .pilist { position: relative; max-height: 246px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .pitem { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; min-height: 40px; cursor: pointer; }
  .pitem + .pitem { border-top: 1px solid color-mix(in oklch, var(--border) 60%, transparent); }
  .pitem:hover, .pitem.cursor { background: var(--accent-soft); }
  .pitem .pn2 { min-width: 0; }
  .pitem .pp { font-family: var(--font-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .pv { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .pitem .pr { display: flex; align-items: center; gap: 6px; }
  .phead2 { padding: 5px 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg-sunken); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
  .oplist { display: grid; grid-template-columns: repeat(auto-fit, minmax(212px, 1fr)); gap: 6px; }
  .opitem { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); text-align: left; min-height: 44px; }
  .opitem:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opitem[disabled] { opacity: .5; cursor: not-allowed; }
  .opitem[disabled]:hover { border-color: var(--border); background: var(--surface); }
  .opitem .on { font-family: var(--font-mono); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .opitem .od { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .kv { display: grid; grid-template-columns: minmax(0,1fr) 14px minmax(0,1fr) 26px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .kv .ka { color: var(--muted); text-align: center; font-family: var(--font-mono); }
  .input { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 12px; font-family: var(--font-mono); width: 100%; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .xbtn { width: 26px; height: 26px; border-radius: 5px; color: var(--muted); display: grid; place-items: center; }
  .xbtn:hover { background: var(--fg-tint); color: var(--fg); }

  /* ─── 状态条 ─────────────────────────────────────────────────────── */
  .status { flex: 0 0 auto; border-top: 1px solid var(--border); background: var(--surface); }
  .status-head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 11.5px; }
  .status-head .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--accent); }
  .status-head .dot.warn { background: var(--warn); }
  .status-head .dot.err { background: var(--danger); }
  .status-head .txt b { font-weight: 600; }
  .status-list { max-height: 168px; overflow: auto; border-top: 1px dashed var(--border); padding: 4px 0 8px; }
  .sitem { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 8px; align-items: baseline; padding: 5px 12px; font-size: 12px; cursor: pointer; text-align: left; width: 100%; }
  .sitem:hover { background: var(--fg-soft); }
  .sitem .si { font-family: var(--font-mono); font-size: 11px; }
  .sitem.err .si { color: var(--danger); }
  .sitem.warn .si { color: var(--warn); }
  .sitem.info .si { color: var(--muted); }
  .sitem .sw { color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; white-space: nowrap; }
  .sitem .sd { color: var(--muted); }

  /* ─── 编译预览抽屉 ───────────────────────────────────────────────── */
  .drawer { flex: 0 0 auto; }
  .drawer.collapsed .drawer-body { display: none; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { padding: 4px 10px; min-height: 26px; font-size: 11.5px; color: var(--muted); border-radius: 6px; }
  .tabs button[aria-selected="true"] { background: var(--fg-tint); color: var(--fg); font-weight: 600; }
  .tabs button:hover { color: var(--fg); }
  .drawer-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--border); }
  .drawer-body.single { grid-template-columns: 1fr; }
  .code { margin: 0; min-width: 0; padding: 10px 12px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.62; overflow: auto; max-height: clamp(160px, 30vh, 300px); white-space: pre; color: var(--fg); background: var(--surface); }
  .code + .code { border-left: 1px solid var(--border); }
  .code .k { color: var(--fg); }
  .code .s { color: var(--accent); }
  .code .n { color: var(--fg); }
  .code .u { color: var(--danger); }
  .code pre { margin: 0; }

          var done = r.children.filter(function (c) { return c.expr; }).length;

  /* ─── 渲染：来源货架 ─────────────────────────────────────────────── */

    if (e.key === 'Escape') {
      if (state.panel) { state.panel = null; renderAll(); }
      else if (state.filter === 'unmapped') { state.filter = 'all'; syncFilter(); renderAll(); }
      return;
    }
    if (typing) {
      if (e.target.id === 'panelSearch') {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          var opts = document.querySelectorAll('#panelList [data-pick]');
          if (!opts.length) return;
          state.panel.cursor = Math.max(0, Math.min(opts.length - 1, (state.panel.cursor || 0) + (e.key === 'ArrowDown' ? 1 : -1)));
          var list = $('#panelList');
          list.innerHTML = fieldListHtml(rowByPath(state.panel.row), state.panel.row, state.panel);
          var cur = list.querySelector('.pitem.cursor');
          if (cur) list.scrollTop = Math.max(0, cur.offsetTop - list.clientHeight / 2);
          return;
        }
        if (e.key === 'Enter') {
          var pick = document.querySelector('#panelList .pitem.cursor') || document.querySelector('#panelList [data-pick]');
          if (pick) pickSource(state.panel.row, pick.dataset.pick);
          return;
        }
      }
      if (e.key === 'Enter' && e.target.id === 'panelInput') { document.querySelector('[data-commitlit]').click(); return; }
      return;
    }
    // 键盘等价于点击：表达式块 / 空槽 / ＋ / 货架字段都能用回车触发
    if (e.key === 'Enter' || e.key === ' ') {
      var ae = document.activeElement, d = (ae && ae.dataset) || {};
      if (d.node || d.slot || d.opmenu || d.addpart) { e.preventDefault(); ae.click(); return; }
      if (d.field && state.sel) {
        e.preventDefault();
        pickSource(state.sel, d.field);
        return;
      }
    }
    if (e.key === '/') { e.preventDefault(); openOpPanel(state.sel || '0'); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      var all = Array.prototype.slice.call(document.querySelectorAll('[data-rowline]')).map(function (x) { return x.dataset.rowline; });
      if (!all.length) return;
      e.preventDefault();
      var i = all.indexOf(state.sel);
      var j = e.key === 'ArrowDown' ? Math.min(i + 1, all.length - 1) : Math.max(i - 1, 0);
      state.sel = all[j === -1 ? 0 : j]; state.panel = null; renderAll();
      return;
    }
    if (e.key === 'Enter' && state.sel) { openFieldPanel(state.sel, '0', null); return; }
    if ((e.key === 'Backspace' || e.key === 'Delete') && state.sel) { clearRow(state.sel); return; }
    if (e.key === '[') { e.preventDefault(); openFieldPanel(state.sel || '0', '0', null); return; }
  });

  // 启动
  renderAll();
  syncFilter();
  syncDrawerUI();
  runTrial(true);   // 首次进入先跑一遍，让试算面板有内容（真实入口是「运行试算」按钮 / ⌘⏎）
  renderStatus();
})();
</script>
</body>
</html>
