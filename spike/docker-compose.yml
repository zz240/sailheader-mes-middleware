services:
  mysql:
    image: mysql:8.0
    container_name: edge-gateway-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edge_gateway
      MYSQL_USER: gateway
      MYSQL_PASSWORD: gateway
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  rabbitmq:
    image: rabbitmq:3-management
    container_name: edge-gateway-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
