server:
  port: 8080

spring:
  application:
    name: edge-gateway-spike
  datasource:
    url: jdbc:mysql://localhost:3306/edge_gateway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: gateway
    password: gateway
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

edge:
  mapping:
    suggester: rule # rule | llm；站点级可在 site.suggester 覆盖
    llm:
      base-url: http://localhost:11434/v1 # OpenAI 兼容端点（Ollama/vLLM/云厂商网关均可）
      model: qwen2.5:7b
      api-key: not-needed
      timeout-seconds: 30

# 凭证加密 master key（Base64 编码 32 字节）：不设置时生成临时 key（重启后失效）
# 生成示例（PowerShell）：[Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Max 256 }))
# 然后设置环境变量 EDGE_MASTER_KEY 后启动

camel:
  springboot:
    name: edge-gateway-spike

logging:
  level:
    org.apache.camel: info
