server:
  port: 8080

spring:
  application:
    name: edge-gateway-spike
  datasource:
    url: jdbc:mysql://localhost:3306/edge_gateway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: gateway
    password: gateway
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

edge:
  mapping:
    suggester: rule # rule | llm；站点级可在 site.suggester 覆盖
    llm:
      base-url: http://localhost:11434/v1 # OpenAI 兼容端点（Ollama/vLLM/云厂商网关均可）
      model: qwen2.5:7b
      api-key: not-needed
      timeout-seconds: 30

camel:
  springboot:
    name: edge-gateway-spike

logging:
  level:
    org.apache.camel: info
