version: "3.7"
services:
  middleware-postgresql:
    image: postgres:12-alpine
    container_name: middleware-postgresql
    restart: always
    ports:
    - 9001:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: middleware
    volumes:
    - /data/sailheader/middleware/postgresql:/var/lib/postgresql/data
    - ./db/pgsql/:/docker-entrypoint-initdb.d/
    networks:
      middleware-network:
        ipv4_address: 173.26.1.11
  other-sql-server:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: other-sql-server
    ports:
      - 9002:1433
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "Root123456"
    networks:
      middleware-network:
        ipv4_address: 173.26.1.13

networks:
  middleware-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.26.1.0/28