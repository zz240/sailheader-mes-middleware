version: "3.7"
services:
  middleware-postgresql:
    image: swr.cn-north-4.myhuaweicloud.com/cloud-sailheader/middleware-postgresql:1.1.0
    container_name: user-middleware-postgresql
    restart: always
    ports:
      - 9001:5432
    volumes:
      - /data/sailheader/middleware/postgresql:/var/lib/postgresql/data
    networks:
      middleware-network:
        ipv4_address: 173.26.1.11
        # 单元测试相关 sqlserver
#  other-sql-server:
#    image: mcr.microsoft.com/mssql/server:2019-latest
#    container_name: other-sql-server
#    ports:
#      - 9002:1433
#    environment:
#      ACCEPT_EULA: Y
#      SA_PASSWORD: "Root123456"
#    networks:
#      middleware-network:
#        ipv4_address: 173.26.1.13
  middleware:
    image: swr.cn-north-4.myhuaweicloud.com/cloud-sailheader/middleware:1.1.1
    container_name: middleware
    depends_on:
      - middleware-postgresql
    restart: always
    ports:
      - 8080:8080
    environment:
      PROFILE: prod
    volumes:
      - /data/sailheader/middleware/logs:/data/sailheader/middleware/logs
    networks:
      middleware-network:
        ipv4_address: 173.26.1.14

networks:
  middleware-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.26.1.0/28