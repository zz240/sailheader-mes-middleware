# 影子站点：客户侧 SQL Server（金蝶/用友形状）
#
# 起法（与仓库现有的 mysql/rabbitmq 各管各的，端口不冲突）：
#   docker compose -f tools/shadow-site/docker-compose.yml up -d
# 停止（保留数据卷）：
#   docker compose -f tools/shadow-site/docker-compose.yml down
# 连进去：
#   docker exec -it edge-shadow-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "EdgeShadow#2026" -C
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edge-shadow-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "EdgeShadow#2026"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
